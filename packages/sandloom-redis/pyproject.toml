[project]
name = "sandloom-redis"
version = "0.7.0a16"
description = "Redis drivers for Sandloom: atomic store, lease, broadcast, cache and the Streams event bus"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "sandloom>=0.7.0a16,<0.8",
    "orjson>=3.13.0,<4",
    "pydantic>=2,<3",
    "redis>=5.2.1,<6",
]

[project.optional-dependencies]
# The hiredis parser of the Redis client (faster reply parsing); optional.
hiredis = ["redis[hiredis]>=5.2.1,<6"]

[project.entry-points."sandloom.drivers"]
"atomic_store.redis" = "sandloom_redis.atomic_store:RedisAtomicStoreProvider"
"lease.redis" = "sandloom_redis.lease:RedisLeaseProvider"
"broadcast.redis" = "sandloom_redis.broadcast:RedisBroadcastProvider"
"cache.redis" = "sandloom_redis.cache:RedisCacheProvider"
"eventbus.streams" = "sandloom_redis.eventbus.driver:StreamsEventBusProvider"

# The Redis half of the test harness (sandloom.driverkit.testing_family),
# loaded by the kernel's test harness.
[project.entry-points."sandloom.testing"]
redis = "sandloom_redis.testing.family:FAMILY"

# The Redis server of the standard stack (sandloom.driverkit.stack_service):
# what `sandloom dev` and the scaffold of `sandloom new` ask of it.
[project.entry-points."sandloom.stack"]
redis = "sandloom_redis.stack:STACK_SERVICE"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandloom_redis"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/NOTICE", "/README.md", "/CHANGELOG.md", "/pyproject.toml"]
