[project]
name = "sandloom-identity"
version = "0.7.0a1"
classifiers = ["Development Status :: 3 - Alpha"]
description = "Identity and authentication for Sandloom: users, JWT, RBAC, two-factor authentication and SSO."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vasyl Cherniavskyi" }]
requires-python = ">=3.11"
# An ecosystem module like any third party's: a compatible framework range,
# never an exact pin. Contract calls to other modules are bound at runtime
# and use the consumer's own generated stubs: no module depends on another.
dependencies = [
    "sandloom>=0.7.0a1,<0.8",
    "pyotp>=2.10.0,<3",
    "authlib>=1.8.0,<2",
    "qrcode>=8.2,<9",
    "pillow>=13.0.0,<14",
    "itsdangerous>=2.2.0,<3",
    "email-validator>=2.3.0,<3",
]

[project.urls]
Homepage = "https://sandloom.dev/"
Documentation = "https://sandloom.dev/docs/"
Repository = "https://github.com/Sandloom-dev/sandloom"
Issues = "https://github.com/Sandloom-dev/sandloom/issues"
Changelog = "https://github.com/Sandloom-dev/sandloom/blob/main/packages/sandloom-identity/CHANGELOG.md"

# The module name (`identity`: tables, migration chain, channels, contracts) and
# its import path; SANDLOOM_MODULES may name it by either.
[project.entry-points."sandloom.modules"]
identity = "sandloom_identity"

[build-system]
requires = [
    "hatchling>=1.27",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = [
    "../editable/sandloom-identity",
]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "../../tools/packaging/package_build.py"

[tool.sandloom.sources]
"../../src/sandloom_identity" = "sandloom_identity"
