[project]
name = "sandloom-celery"
version = "0.7.0a14"
description = "Celery driver for Sandloom: taskqueue, worker host and scheduler"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "sandloom>=0.7.0a14,<0.8",
    "pydantic>=2,<3",
    "orjson>=3.13.0,<4",
    "celery[redis]>=5.6.3,<6",
    # The same bound as sandloom-redis: the Redis client is imported through the
    # celery extra, which would otherwise accept any release.
    "redis>=5.2.1,<6",
]

[project.optional-dependencies]
# The hiredis parser of the Redis client (faster reply parsing); optional.
hiredis = ["redis[hiredis]>=5.2.1,<6"]

[project.entry-points."sandloom.drivers"]
"taskqueue.celery" = "sandloom_celery.taskqueue:CeleryTaskQueueProvider"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandloom_celery"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/NOTICE", "/README.md", "/CHANGELOG.md", "/pyproject.toml"]
