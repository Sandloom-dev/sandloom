[project]
name = "sandloom"
version = "0.7.0a14"
classifiers = ["Development Status :: 3 - Alpha"]
description = "Python backend framework for AI-driven development with enforced module boundaries and pluggable infrastructure."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Vasyl Cherniavskyi" },
]
requires-python = ">=3.11"
# Ranges, never exact pins: `>=tested,<next breaking release` (for a 0.x
# project the next minor). Exact versions live only in uv.lock. A narrower
# range says why: the framework relies on that release's internals there.
dependencies = [
    # Remove the compromised emSign CA from outbound HTTPS trust bundles.
    "certifi>=2026.10.19",
    # route dependant pruning (sandloom.core.route_markers) and the OpenAPI
    # hooks rely on FastAPI internals: one minor at a time.
    "fastapi>=0.136.3,<0.137",
    # the request middleware relies on Starlette internals (checked up to 1.6).
    "starlette>=1.3.1,<1.7",
    "uvicorn[standard]>=0.54.0,<1",
    "uvicorn-worker>=0.4.0,<0.5",
    # the planner compiler (sql_alchemy/planner_adapter) uses 2.1 internals.
    "sqlalchemy[asyncio]>=2.1.4,<2.2",
    "alembic>=1.20.0,<2",
    # the event reader rewrites pydantic-core schemas (sdk/_decl/events.py):
    # version-specific internals, one minor at a time.
    "pydantic>=2.14.1,<2.15",
    "pydantic-settings>=2.16.1,<3",
    "python-dotenv>=1.2.4,<2",
    "httpx>=0.28.1,<0.29",
    # the RPC transport probes aiohttp connector internals
    # (rpc_transport_compat falls back to httpx on a mismatch).
    "aiohttp>=3.14.5,<3.15",
    "msgpack>=1.2.3,<2",
    "orjson>=3.13.0,<4",
    # the sync driver of `sandloom migrate`, backup and extract-module. asyncpg,
    # the async PostgreSQL driver of the application, is the `postgres` extra.
    "psycopg2-binary>=2.9.11,<3",
    "pyjwt>=2.15.1,<3",
    "cryptography>=50.0.2,<51",
    "argon2-cffi>=25.1.0,<26",
    # imported by the app factory, the UoW and eventing (default path).
    "prometheus-client>=0.26.0,<0.27",
    "jsonschema>=4.26.0,<5",
    # the CMD of the framework and every generated production image
    # (gunicorn -c python:sandloom.core.cli.gunicorn_conf).
    "gunicorn>=26.2.0,<27",
]

[project.urls]
Homepage = "https://sandloom.dev/"
Documentation = "https://sandloom.dev/docs/"
Repository = "https://github.com/Sandloom-dev/sandloom"
Issues = "https://github.com/Sandloom-dev/sandloom/issues"
Changelog = "https://github.com/Sandloom-dev/sandloom/blob/main/packages/sandloom/CHANGELOG.md"

[project.optional-dependencies]
# The async PostgreSQL driver the application connects through
# (`postgresql+asyncpg://`). Without it the kernel serves a SQLite database
# (the `sqlite` extra) and refuses a PostgreSQL URL at startup, naming this
# extra (SANDLOOM-B037).
postgres = [
    "asyncpg>=0.32.0,<0.33",
]
# The package of the Redis atomic_store, lease, broadcast and cache drivers and
# of the Streams event bus (sandloom-redis), with its `hiredis` extra: the
# redis-py client and the hiredis parser the pin in
# docs/contributing/dependencies.md is measured on. The client's bound is the
# package's own (one place).
redis = [
    "sandloom-redis[hiredis]>=0.7.0a14,<0.8",
]
# The package of the Celery taskqueue driver and its worker host
# (sandloom-celery), which requires the Celery client the worker tooling uses
# (one place for its bound).
celery = [
    "sandloom-celery>=0.7.0a14,<0.8",
]
# The batteries-included set: the standard composition root
# (sandloom_standard.main), the three standard modules, PostgreSQL, Redis and
# Celery.
standard = [
    "sandloom[postgres,redis,celery]",
    "sandloom-redis>=0.7.0a14,<0.8",
    "sandloom-celery>=0.7.0a14,<0.8",
    "sandloom-standard>=0.7.0a14,<0.8",
    "sandloom-identity>=0.7.0a14,<0.8",
    "sandloom-tenancy>=0.7.0a14,<0.8",
    "sandloom-billing>=0.7.0a14,<0.8",
]
# The console serves no task queue: PostgreSQL and the Redis drivers only.
admin = [
    "sandloom[postgres,redis]",
    "sandloom-admin>=0.7.0a14,<0.8",
    "sandloom-identity>=0.7.0a14,<0.8",
]
# C-accelerated dependencies of the kernel itself. It names no Redis client:
# the hiredis parser of the Redis client is in the `redis` extra.
fast = [
    "jsonschema-rs>=0.59.0,<0.60",
]
# `sandloom check` reads YAML manifests.
check = [
    "PyYAML>=6.0.2,<7",
]
# The test kit (sandloom.sdk.testing, `sandloom test`): pytest plugins and the
# parallel runner a generated app's dev tools bring.
testing = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-xdist>=3.8.0,<4",
]
# SQLite for development and tests (`sqlite+aiosqlite://`); the sqlalchemy
# driver refuses a SQLite URL without it.
sqlite = [
    "aiosqlite>=0.21,<1",
]
# Imported only when SENTRY_DSN is set (sandloom.core.observability).
sentry = [
    "sentry-sdk>=2.72.0,<3",
]
# Imported only when TRACING_URL is set (sandloom.core.observability.tracing):
# the SDK and both OTLP exporters, gRPC and HTTP/protobuf.
otel = [
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
]

[project.scripts]
sandloom = "sandloom:main"

# The SQL dialect renderers of the portable forms in sandloom.sdk.data
# (sandloom.core.sql_alchemy.portable); a database driver package adds its own.
[project.entry-points."sandloom.sql_dialects"]
postgresql = "sandloom.core.drivers.sql_dialects:POSTGRESQL"
sqlite = "sandloom.core.drivers.sql_dialects:SQLITE"

[build-system]
requires = [
    "hatchling>=1.27",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = [
    "../editable/sandloom",
]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "../../tools/packaging/package_build.py"

[tool.sandloom.sources]
"../../src/sandloom" = "sandloom"
"../../migrations/core" = "sandloom/core/migrations/core_chain"

# Repository-only agent files. `sandloom.shared` ships whole (authz, guards,
# subject): no generated stub, DTO copy or event schema of a module is in this
# wheel, each module wheel carries its own (ADR-0013).
[tool.sandloom.exclude]
paths = []

# Local builds (`uvx --from packages/sandloom`) rebuild when the sources change,
# not only when this file does.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "../../src/sandloom/**/*" }, { file = "../../migrations/core/**/*" }]
