# The only upstream setting differs between monolith and split deployment.
map $uri $sandloom_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sandloom_api "${SANDLOOM_ADMIN_API_UPSTREAM}";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $sandloom_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${SANDLOOM_ADMIN_PUBLIC_SCHEME}";
    proxy_set_header X-Internal-Token "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    location /auth/ { proxy_pass $sandloom_api; }
    location /api/v1/ { proxy_pass $sandloom_api; }
    location ~ ^/(_sandloom|diagnostics|contracts|metrics)(/|$) { return 404; }
    location = /admin-manifest.json { try_files $uri =404; }
    location = /config.json { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
