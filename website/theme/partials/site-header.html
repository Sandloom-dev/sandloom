<header class="sl-header{% if is_docs %} md-header{% endif %}" data-md-component="header">
  <div class="sl-header-inner">
    <button type="button" class="sl-menu sl-icon-button" data-sandloom-menu-toggle aria-label="Open navigation" aria-expanded="false" aria-controls="sl-site-menu">
      {% include "partials/menu-icon.html" %}
    </button>
    <a class="sl-brand" href="/" aria-label="Sandloom home">
      {% include "partials/site-logo.html" %}
    </a>
    <div class="sl-header-search">{% include "partials/site-search.html" %}</div>
    <nav class="sl-nav" aria-label="Main navigation">
      {% include "partials/site-links.html" %}
    </nav>
    <a class="sl-repo sl-icon-button" href="https://github.com/Sandloom-dev/sandloom" aria-label="Sandloom on GitHub" title="Sandloom on GitHub">
      <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
    <button class="sl-theme sl-icon-button" type="button" data-sandloom-theme-toggle aria-label="Switch color theme" title="Switch color theme">
      <svg class="sl-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 13.2A8.7 8.7 0 0 1 10.8 3.5a8.7 8.7 0 1 0 9.7 9.7Z"/></svg>
      <svg class="sl-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
    </button>
  </div>
  {% if is_docs %}
  <div class="sl-native-palette" hidden>{% include "partials/palette.html" %}{% include "partials/javascripts/palette.html" %}</div>
  {% endif %}
</header>
{% include "partials/site-menu.html" %}
