# Unified public site: https://sandloom.dev/ with documentation at /docs/.
# docs_site.py keeps local preview metadata on loopback unless --site-url is supplied.
[project]
site_name = "Sandloom"
site_description = "Build SaaS with AI in isolated Python modules. Sandloom supplies identity, tenancy, billing and transaction mechanisms, from monolith to services."
site_author = "Vasyl Cherniavskyi"
repo_url = "https://github.com/Sandloom-dev/sandloom"
repo_name = "Sandloom-dev/sandloom"
copyright = "Copyright &copy; Vasyl Cherniavskyi"
docs_dir = "docs"
exclude_docs = "snippets/\n"
site_url = "https://sandloom.dev/docs/"
extra_css = [
    "/assets/brand.css",
    "assets/sandloom.css",
]
site_dir = "build/site/docs"

[project.validation]
anchors = "warn"

[project.theme]
custom_dir = "website/theme"
name = "zensical"
language = "en"
features = [
    "navigation.instant",
    "navigation.tracking",
    "navigation.top",
    "navigation.indexes",
    "navigation.footer",
    "toc.follow",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
]
variant = "modern"
logo = "assets/sandloom-mark.svg"
favicon = "/assets/favicon.svg"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"

[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"

[project.theme.palette.toggle]
icon = "material/weather-sunny"
name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Manrope"
code = "Hack Nerd Font Mono"

[project.plugins.search]

[project.plugins.section-index]

[project.plugins.llmstxt]
markdown_description = "Sandloom is a modular Python framework for SaaS. Public API: `sandloom.sdk`. Start with Learn; Project decisions and contributor guidance are optional context."
full_output = "llms-full.txt"

