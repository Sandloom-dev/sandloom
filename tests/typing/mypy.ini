# mypy settings of the typing proofs (spec §8.1): the repository's strict
# configuration and pydantic plugin settings, applied to the proof files.
[mypy]
mypy_path = src
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
show_error_codes = True
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

[mypy-celery.*,alembic.*,uvicorn.*,opentelemetry.*,msgpack.*]
ignore_missing_imports = True
