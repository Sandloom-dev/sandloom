# The kernel's edge register (ADR-0012 decision 2), checked by SANDLOOM-T017.
#
# Every place where shipped kernel code (sandloom.core, sandloom.sdk, sandloom.shared,
# sandloom.main; tests excluded) or the sandloom wheel names a module is one row here. The
# check is tests/architecture/kernel_edges.py; `uv run sandloom explain SANDLOOM-T017` says
# what each failure means. Seeded by KB-03 from design/kernel-boundary/edges.yml (the 46 judged
# rows, all `open` except B-N20, the documentation row, `retained`) plus the 18 class (a)
# protocol rows and the two family templates, `retained` with the reason "protocol". KB-08 added
# K1 (in design/kernel-boundary/edges.yml too): 46 + 1 + 18 + 2 = 67 rows. A row added here is
# added to the design register in the same PR, and a flipped current_status is flipped there too
# (test_kernel_edges.py compares them).
#
# A PR that carries a row to its target sets its current_status in the same PR (the check
# fails otherwise) and pastes the report into its description:
#
#   uv run python tests/architecture/kernel_edges.py --report --base origin/arch/kernel-boundary
#
# Row fields: id, kind (runtime | documentation; runtime when absent), class (a | b | c), type,
# scope (runtime | composition_text), owner, baseline_verdict, current_status (open | fixed |
# retained: the code now), target (fixed | retained | deferred: the plan; never decides the
# check), adr, reason (required when retained), prs, anchors (path under src/ unless marked
# "(repository root)", globs allowed; plus a literal or a symbol, never a line number), note.
# Invariants and fitness tests of each row stay in design/kernel-boundary/edges.yml.
#
# An anchor literal written quoted ('"x"') is the exact string; unquoted, a substring. A
# symbol anchor covers the findings inside its definition and resolves while the file still
# defines or uses it; a path-only anchor covers the whole file.
#
# The scan reads string literals and static imports (`from sandloom_x import y`). A row with
# current_status: fixed needs a literal anchor: its literal is matched in every kernel file, and a
# finding holding it anywhere is that row's regression (rule 2).
#
# loader_call_sites: the only places where a dynamic import with a computed argument is
# allowed (I-02), each with its reason; not_edges: literals that match a pattern but name no
# module. Both only shrink: an entry that matches nothing fails.

version: 1
seeded_from: design/kernel-boundary/edges.yml (merged baseline c9b9b05)

# What the scan matches besides module names, packages and channels. `settings` are the
# module-owned settings (globs, case-insensitive) that ADR-0015 moves into module
# declarations; `claim_keys` the module-owned claim keys of ADR-0014 that are not common
# words; `protocol` the kernel's own words that equal a module name (the platform role
# `admin`, ADR-0012 decision 1). When modules declare their settings and claim keys (KB-50,
# KB-30), these lists are read from the declarations instead.
vocabulary:
  protocol: [admin]
  claim_keys: [subscription_status, plan_code]
  settings:
    - TWOFA_*
    - ADMIN_CONSOLE_*
    - BILLING_*
    - STRIPE_*
    - GOOGLE_CLIENT_*
    - GITHUB_CLIENT_*
    - MICROSOFT_CLIENT_*
    - LINKEDIN_CLIENT_*
    - TELEGRAM_BOT_TOKEN
    - SSO_*
    - TENANT_CLAIMS_MAX_ORGANIZATIONS
    - REFRESH_TOKEN_EXPIRE_DAYS
    - MAX_SESSION_DAYS

