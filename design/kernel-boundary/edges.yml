# the row KB-08 added after the baseline (47 rows).
#
# Source of the ids, classes, types, owners and verdicts: baseline.md at b8d8506.
# Target status, carrying ADR and PR: docs/adr/0012..0015 and migration-plan.md.
# KB-03 seeds tests/architecture/kernel_edges.yml from this file (ADR-0012 decision 2); the
# 18 class (a) protocol rows (A1-A18) and the runtime-built family templates <m>.claims.v1 /
# <m>.facts.v1 join there as `retained` rows with reason "protocol"; they are not listed here.
# The live register therefore has 47 + 18 + 2 = 67 rows. A row added to the live register after
# the baseline (K1, KB-08) is added here too, in the last section; ids, kinds, classes, targets,
# ADRs, anchors and current statuses are compared with the live register by
# tests/architecture/test_kernel_edges.py, so the two files cannot drift.
#
# Fields
#   kind             runtime | documentation (absent means runtime; ADR-0012 decision 2).
#                    runtime: the AST scan finds the literal, import or file, and the T017 rules
#                    below apply strictly. documentation: the name appears only in a docstring or
#                    comment, which the scan excludes, so the row never has a runtime finding and
#                    needs none; it is tracked separately: retained with an ADR id and a reason,
#                    its anchor file must exist and contain the literal (else stale), and it never
#                    covers a runtime finding of the same literal
#   class            a | b | c (baseline.md section 1)
#   type             import | package | runtime_call | configuration | security_authority | naming
#   scope            runtime | composition_text
#   owner            the module that owns the named thing (baseline "Owner")
#   baseline_verdict allowed | violation | disputed
#   current_status   open | fixed | retained: the row's state in the code now. `open`: the finding
#                    exists and is still to be removed or decided; `fixed`: no finding may exist;
#                    `retained`: the finding stays, with an ADR id and a reason. KB-03 seeded the
#                    live register with every row `open` except B-N20 (`retained`); a PR that
#                    flips a row in tests/architecture/kernel_edges.yml flips it here too (after
#                    W0: B-I1 and B-N19 fixed, B-N20 and K1 retained, the rest open)
#   target           fixed | retained | deferred: where the ADRs take the row. A PR that carries
#                    the row to its target flips current_status in the same PR
#   adr              the ADR that decides the target
#   prs              migration-plan.md PR ids that carry the change (the last one closes the row)
#   invariants       requirements.md ids the row serves
#   tests            fitness tests that prove the target (besides the kernel-edge check,
#                    SANDLOOM-T017, which covers every runtime row by current_status: a finding
#                    no runtime row's anchors match fails; a runtime row with current_status fixed
#                    and a finding fails (regression); a runtime row with current_status open or
#                    retained and no finding fails ("set current_status: fixed"); a documentation
#                    row is checked only as described under kind; target never makes the check
#                    pass or fail, it is the plan)
#   anchors          path (under src/ unless stated; globs allowed) and a literal or symbol, or
#                    the path alone (the whole file); no line numbers. KB-03 added the anchors the
#                    first run of the check needed to cover every finding of the same edge (B-C2,
#                    B-C5, B-C6, B-N5, B-N7, C1-C3); tests/architecture/kernel_edges.yml is the live
#                    register from then on
#   note             reason, especially for retained and deferred rows

