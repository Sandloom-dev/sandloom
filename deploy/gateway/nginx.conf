events {}

http {
    server_tokens off;
    # Path-prefix routing: each module's route prefixes go to the service that
    # loads it. `sandloom add deploy` (re)writes the generated blocks below from the
    # modules' routes; edit outside the markers freely.

    # Re-resolve service names through Docker's embedded DNS. A plain
    # `server <svc>:<port>;` is resolved ONCE at startup: a recreated container
    # (new IP) answered 502 until the gateway restarted. `resolve` (nginx
    # >= 1.27.3, needs the shared-memory `zone`) follows the name instead.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # Fail fast while a service is down instead of hanging the client
    # (~14s before a 502 with the defaults). Only idempotent requests are
    # retried (nginx never retries POST/PATCH/... without `non_idempotent`).
    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    # Leave time for the app's 30 s statement timeout to roll back and return
    # its error instead of racing that response with a gateway 504.
    proxy_read_timeout 45s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    # Same request-body ceiling as the app (MAX_UPLOAD_SIZE_BYTES default
    # 50 MiB, enforced in-process in the monolith): nginx's 1m default would
    # reject in the split profile what the monolith accepts. Raise both
    # together.
    client_max_body_size 50m;

    # Forward the real client address. $proxy_add_x_forwarded_for APPENDS the
    # peer nginx saw ($remote_addr) to any client-sent X-Forwarded-For, so the
    # app walks the chain right-to-left from its trusted gateway hop
    # (TRUSTED_PROXY_IPS) and never trusts the client-controlled left part.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never let a client supply the internal-auth header through the gateway.
    proxy_set_header X-Internal-Token "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # >>> generated by sandloom add deploy: upstreams sha:8527af8532a1
    upstream identity {
        zone upstream_identity 64k;
        server identity:2222 resolve;
        keepalive 32;
        keepalive_timeout 60s;
    }
    upstream tenancy {
        zone upstream_tenancy 64k;
        server tenancy:2222 resolve;
        keepalive 32;
        keepalive_timeout 60s;
    }
    upstream billing {
        zone upstream_billing 64k;
        server billing:2222 resolve;
        keepalive 32;
        keepalive_timeout 60s;
    }
    # <<< generated by sandloom add deploy: upstreams

    server {
        listen 8080;
        # Redirects nginx itself issues must stay relative (the published
        # port differs from the listen port).
        absolute_redirect off;

        # Each module's route prefixes, bounded at the segment as Starlette
        # matches (`location = /x` and `location /x/`; a bare `location /x`
        # would also take `/xy`, and `/x/` alone makes nginx 301 `/x`), then the catch-all `location /`: a 404 for the internal surfaces
        # (/_sandloom/rpc, /diagnostics, /metrics, /contracts, service /health and
        # /ready, docs) and unknown paths, or the service serving root-level
        # routes (`/{slug}`), the internal surfaces then a 404 each.
        # >>> generated by sandloom add deploy: routes sha:f729d90c55cc
        # identity: sandloom_identity
        location = /api/v1/permissions { proxy_pass http://identity; }
        location /api/v1/permissions/ { proxy_pass http://identity; }
        location = /api/v1/platform/identity { proxy_pass http://identity; }
        location /api/v1/platform/identity/ { proxy_pass http://identity; }
        location = /api/v1/roles { proxy_pass http://identity; }
        location /api/v1/roles/ { proxy_pass http://identity; }
        location = /api/v1/users { proxy_pass http://identity; }
        location /api/v1/users/ { proxy_pass http://identity; }
        location = /auth { proxy_pass http://identity; }
        location /auth/ { proxy_pass http://identity; }
        # tenancy: sandloom_tenancy
        location = /api/v1/invitations { proxy_pass http://tenancy; }
        location /api/v1/invitations/ { proxy_pass http://tenancy; }
        location = /api/v1/orgs { proxy_pass http://tenancy; }
        location /api/v1/orgs/ { proxy_pass http://tenancy; }
        location = /api/v1/platform/tenancy { proxy_pass http://tenancy; }
        location /api/v1/platform/tenancy/ { proxy_pass http://tenancy; }
        # billing: sandloom_billing
        location = /api/v1/billing { proxy_pass http://billing; }
        location /api/v1/billing/ { proxy_pass http://billing; }
        location = /api/v1/platform/billing { proxy_pass http://billing; }
        location /api/v1/platform/billing/ { proxy_pass http://billing; }
        # internal surfaces and unknown paths: 404 at the edge
        location / { return 404; }
        # <<< generated by sandloom add deploy: routes

        # health of the gateway itself
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
    }
}
