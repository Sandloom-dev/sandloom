            / (sum by (job) (rate(sandloom_http_requests_total{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"POST|PUT|PATCH|DELETE"}[30m])) > 0)
          )
      - record: sandloom:sli_read_slow:ratio_rate30m
        expr: |-
          1 - (
            sum by (job) (rate(sandloom_http_request_duration_seconds_bucket{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"GET|HEAD", le=~"0\\.25"}[30m]))
            / (sum by (job) (rate(sandloom_http_request_duration_seconds_count{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"GET|HEAD"}[30m])) > 0)
          )
      - record: sandloom:sli_write_slow:ratio_rate30m
        expr: |-
