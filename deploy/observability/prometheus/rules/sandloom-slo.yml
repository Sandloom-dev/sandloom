            / (sum by (job) (rate(sandloom_http_request_duration_seconds_count{method="POST", path="/auth/login"}[30m])) > 0)
          )
      - record: sandloom:sli_event_slow:ratio_rate30m
        expr: |-
          1 - (
            sum by (job) (rate(sandloom_event_end_to_end_latency_seconds_bucket{le=~"5(\\.0)?"}[30m]))
            / (sum by (job) (rate(sandloom_event_end_to_end_latency_seconds_count{}[30m])) > 0)
          )
      - record: sandloom:sli_read_errors:ratio_rate1h
        expr: |-
          1 - (
            sum by (job) (rate(sandloom_http_requests_total{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"GET|HEAD", status!~"5.."}[1h]))
            / (sum by (job) (rate(sandloom_http_requests_total{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"GET|HEAD"}[1h])) > 0)
          )
      - record: sandloom:sli_write_errors:ratio_rate1h
        expr: |-
          1 - (
            sum by (job) (rate(sandloom_http_requests_total{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"POST|PUT|PATCH|DELETE", status!~"5.."}[1h]))
            / (sum by (job) (rate(sandloom_http_requests_total{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"POST|PUT|PATCH|DELETE"}[1h])) > 0)
          )
      - record: sandloom:sli_read_slow:ratio_rate1h
        expr: |-
