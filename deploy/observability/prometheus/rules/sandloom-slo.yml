            / (sum by (job) (rate(sandloom_event_end_to_end_latency_seconds_count{}[1h])) > 0)
          )
      - record: sandloom:sli_read_errors:ratio_rate6h
        expr: |-
          1 - (
            sum by (job) (rate(sandloom_http_requests_total{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"GET|HEAD", status!~"5.."}[6h]))
            / (sum by (job) (rate(sandloom_http_requests_total{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"GET|HEAD"}[6h])) > 0)
