            / (sum by (job) (rate(sandloom_event_end_to_end_latency_seconds_count{}[6h])) > 0)
          )
      - record: sandloom:sli_outbox_fresh:bool
        expr: max by (job) (sandloom_outbox_oldest_pending_age_seconds) < bool 10

  - name: sandloom-slo-burn
    rules:
      - alert: SandloomApiReadAvailabilityBurnFast
        expr: >-
          sandloom:sli_read_errors:ratio_rate1h > (14.4 * 0.001)
          and sandloom:sli_read_errors:ratio_rate5m > (14.4 * 0.001)
        labels:
          severity: page
          slo: api-read-availability
        annotations:
          summary: "{{ $labels.job }}: API reads burn the 99.9 % availability budget 14x too fast"
          description: "5xx ratio over 1h: {{ $value | humanizePercentage }}. At this rate the 30-day budget is gone in ~2 days."
          runbook_url: https://github.com/Sandloom-dev/sandloom/blob/main/docs/reference/slo.md#burn-rate-alerts
      - alert: SandloomApiReadAvailabilityBurnSlow
        expr: >-
          sandloom:sli_read_errors:ratio_rate6h > (6 * 0.001)
          and sandloom:sli_read_errors:ratio_rate30m > (6 * 0.001)
        labels:
          severity: warning
          slo: api-read-availability
        annotations:
          summary: "{{ $labels.job }}: API reads burn the 99.9 % availability budget 6x too fast"
          description: "5xx ratio over 6h: {{ $value | humanizePercentage }}. At this rate the 30-day budget is gone in ~5 days."
          runbook_url: https://github.com/Sandloom-dev/sandloom/blob/main/docs/reference/slo.md#burn-rate-alerts
      - alert: SandloomApiWriteAvailabilityBurnFast
        expr: >-
          sandloom:sli_write_errors:ratio_rate1h > (14.4 * 0.001)
          and sandloom:sli_write_errors:ratio_rate5m > (14.4 * 0.001)
        labels:
          severity: page
          slo: api-write-availability
        annotations:
          summary: "{{ $labels.job }}: API writes burn the 99.9 % availability budget 14x too fast"
          description: "5xx ratio over 1h: {{ $value | humanizePercentage }}. At this rate the 30-day budget is gone in ~2 days."
          runbook_url: https://github.com/Sandloom-dev/sandloom/blob/main/docs/reference/slo.md#burn-rate-alerts
      - alert: SandloomApiWriteAvailabilityBurnSlow
        expr: >-
          sandloom:sli_write_errors:ratio_rate6h > (6 * 0.001)
          and sandloom:sli_write_errors:ratio_rate30m > (6 * 0.001)
        labels:
          severity: warning
          slo: api-write-availability
        annotations:
          summary: "{{ $labels.job }}: API writes burn the 99.9 % availability budget 6x too fast"
          description: "5xx ratio over 6h: {{ $value | humanizePercentage }}. At this rate the 30-day budget is gone in ~5 days."
          runbook_url: https://github.com/Sandloom-dev/sandloom/blob/main/docs/reference/slo.md#burn-rate-alerts
