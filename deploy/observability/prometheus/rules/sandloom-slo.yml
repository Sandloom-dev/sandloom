            / (sum by (job) (rate(sandloom_http_request_duration_seconds_count{path!~"/health.*|/ready|/metrics|<unmatched>", method=~"POST|PUT|PATCH|DELETE"}[30m])) > 0)
          )
      - record: sandloom:sli_login_errors:ratio_rate30m
        expr: |-
          1 - (
            sum by (job) (rate(sandloom_http_requests_total{method="POST", path="/auth/login", status!~"5.."}[30m]))
            / (sum by (job) (rate(sandloom_http_requests_total{method="POST", path="/auth/login"}[30m])) > 0)
          )
      - record: sandloom:sli_login_slow:ratio_rate30m
        expr: |-
