# Local-only development and disposable test services.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sandloom
      POSTGRES_PASSWORD: sandloom
      POSTGRES_DB: academy
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dev_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandloom"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: sandloom_test
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis_test:
    image: redis:7-alpine
    command: ["redis-server", "--databases", "256"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  dev_postgres:
