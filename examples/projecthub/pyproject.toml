[project]
name = "projecthub"
version = "0.1.0"
description = "A Sandloom application."
requires-python = ">=3.11"
dependencies = [
    "sandloom[redis,celery]>=0.7.0a4,<0.8",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "pre-commit==4.7.0",
    "sandloom[check,testing]",
]

[dependency-groups]
dev = [
    "projecthub[dev]",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "projecthub",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
testpaths = [
    "projecthub",
    "tests",
]
python_files = [
    "test_*.py",
]
addopts = [
    "-v",
    "--tb=short",
    "--asyncio-mode=auto",
    "-p",
    "sandloom.sdk.testing.plugin",
]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
fix = true
force-exclude = true
extend-exclude = [
    "projecthub/modules/*/migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = [
    "sandloom",
    "projecthub",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "E501",
]

[tool.mypy]
strict = true
plugins = [
    "pydantic.mypy",
]
exclude = [
    "/migrations/",
    ".*/tests/.*",
]

[tool.uv.sources]
sandloom = { path = "../../packages/sandloom", editable = true }
