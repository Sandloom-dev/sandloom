# Sandloom guarantee & capability ledger — the machine-checked list of what the
# framework promises. Gate: tests/architecture/test_guarantee_ledger.py
# (checker: tools/checks/guarantees.py). Reference page, generated from this file:
# docs/reference/guarantees.md (`uv run python tools/checks/guarantees.py render`).
#
# Rules
# - guarantees: G-<AREA>-NN, behaviour that must never weaken.
#   capabilities: C-<AREA>-NN, features a user relies on existing.
# - tests: pytest node ids relative to the repo root that FAIL if the entry is
#   weakened; rules: `sandloom check` rule names; import_contracts: .importlinter ids.
#   No enforcement at all -> `gap` + `gap_size` (S < 40-line test, M ~ a day, L more).
# - An id is never reused or silently dropped: `issued` holds the highest number
#   per prefix; every issued id is either live below or listed under `removed:`
#   with statement, reason, approved_by (the owner's approval note) and date.
# - adr_sections: every ##/### heading of every docs/adr/NNNN-*.md maps to the ids that
#   cover it, or `informational`. A new ADR (or section) needs its entries.
# - A change that removes or infers a declaration keeps this file green and
#   shows the same enforcing tests passing: `uv run pytest -m guarantees src`.

schema: 1

guarantees:
- id: G-TENANT-01
  statement: An ORM read, update or delete against a TenantScoped model with no tenant bound (and not
    inside unscoped()) raises MissingTenantError instead of running cross-tenant.
  sources:
  - docs/modules/database/multi-tenancy.md
  - docs/reference/security-model.md#Tenant isolation
  tests:
  - src/sandloom/core/tests/test_tenant_isolation.py::test_no_tenant_bound_fails_closed
  - src/sandloom/core/tests/test_tenant_criteria_prebuilt.py::test_no_tenant_fails_closed
  - src/sandloom/core/tests/test_tenant_guard_early_exit.py::test_tenant_statements_are_still_scoped_and_fail_closed
- id: G-TENANT-02
  statement: Once a tenant is bound, ORM SELECT, bulk UPDATE and bulk DELETE on a TenantScoped model are
    automatically filtered to that tenant's rows only.
  sources:
  - docs/modules/database/multi-tenancy.md
  - docs/reference/security-model.md#Tenant isolation
  tests:
