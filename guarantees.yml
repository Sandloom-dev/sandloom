  - tests/sdk/test_sdk_projection_ops.py::test_a_store_target_refuses_deltas_and_two_targets
  - tests/sdk/test_sdk_projection_ops.py::test_an_independent_group_never_resurrects_a_store_tombstone
- id: G-MSTORE-09
  statement: Tombstones are versioned and beat any late older upsert; only a newer write of the group that owns
    deletion clears one (never another group's upsert, on a relational model and a store target alike, as the
    conditional_write conformance kit checks); they are purged only by purge_tombstones(name,
    older_than=) / sandloom projection purge, which refuses an older_than below the replay horizon (stream retention
    + relay horizon, the oldest DLQ entry and the oldest dead outbox row of the source channels; never with an unbounded
    retention) and while any rebuild runs (running rebuilds are counted, so one finishing never lifts the
    exclusion of another; a rebuild's entry and a purge's rebuild check, watermark raise and delete are
    mutually exclusive - the purge window, a per-projection transaction advisory lock the relational
    begin_rebuild takes too, an asyncio lock in memory - so a rebuild that starts after the purge read no
    rebuild waits until the delete is done, and a purge after a begun rebuild is refused), raises the monotonic purged_before watermark before deleting (a rebuild
    never lowers it), and from then on the apply path dead-letters an event emitted before the watermark (fail closed
    without emitted_at); the apply''s watermark check and its write are atomic with respect to a purge (the apply''s
    unit holds the watermark row FOR SHARE, created when missing, until it commits; the raise row-locks it), so a
    purge racing an apply never resurrects a row, on a relational model and a store target alike.
  sources:
  - docs/adr/0010-public-api-1.0.md#6. Guarantees as a lattice, labels derived from mechanisms (amends ADR-0005)
  - tests/fixtures/specs/public-api-1.0-spec.md#6.4 Projection convergence model
  tests:
  - tests/laws/test_projection_laws.py::test_a_tombstone_beats_any_late_older_upsert
  - tests/sdk/test_sdk_projections.py::test_a_tombstone_beats_a_late_older_upsert
  - src/sandloom/core/tests/test_projection_kernel.py::test_a_purge_below_the_replay_horizon_is_refused
  - src/sandloom/core/tests/test_projection_kernel.py::test_the_watermark_is_raised_before_the_delete_and_never_lowered
  - src/sandloom/core/tests/test_projection_kernel.py::test_a_purge_refuses_during_a_rebuild_and_a_rebuild_keeps_the_mark
  - src/sandloom/core/tests/test_projection_kernel.py::test_an_event_older_than_the_watermark_is_dead_lettered
  - src/sandloom/core/tests/test_projection_watermarks_db.py::test_the_watermark_only_ever_rises
  - src/sandloom/core/tests/test_projection_watermarks_db.py::test_the_rebuild_flag_is_set_and_cleared_without_touching_the_mark
  - src/sandloom/core/tests/test_projection_kernel.py::test_concurrent_rebuilds_keep_the_purge_excluded_in_memory
  - src/sandloom/core/tests/test_projection_watermarks_db.py::test_concurrent_rebuilds_keep_the_purge_excluded_in_the_table
  - src/sandloom/core/tests/test_projection_kernel.py::test_a_rebuild_never_enters_a_running_purge_in_memory
