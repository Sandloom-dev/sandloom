- id: G-DECL-01
  statement: 'An Event class is a producer when its channel prefix is the defining module (or stated),
    else a view; channels are versioned, fields are from the closed set of wire shapes (round 10: an event payload is plain
    data - scalars (str, int, float, bool, None, UUID, datetime, date, time, timedelta, Decimal, Enum, Literal, Any
    as an opaque JSON value), X | None and (round 11) unions of Literal / Enum members none of which reads another
    member''s published value, list / tuple / set and frozenset of scalars /
    dict[str, T], pydantic BaseModel DTOs, and unions of DTOs only when discriminated by a Literal tag field; every
    other shape at any depth is refused at class definition with SANDLOOM-B015 naming the field path and the fix: (round
    11) a union of scalars whose members read the same value (int | str, UUID | str, float | int, datetime | str,
    Literal[1] | Literal[True]) in any union_mode, strict or not, an empty wire name (alias, serialization_alias or an
    alias_generator returning ""), two fields with one wire name or a field named like another field''s wire name in a
    model that reads by name, a model_config option outside the whitelist (ser_json_timedelta / temporal / inf_nan /
    bytes, val_json_bytes, val_temporal_unit, coerce_numbers_to_str, regex_engine, use_enum_values,
    polymorphic_serialization, json_encoders, json_schema_mode_override, allow_inf_nan=True, any unlisted key), a float
    that may be NaN or infinite (the Event base sets allow_inf_nan=False; a DTO states it), SerializeAsAny and any
    other node serializer, coerce_numbers_to_str on a field - so every class that defines round-trips: a property test
    over random classes from the whole set and from the refused shapes and options holds every one that defines to
    to_wire, standard JSON (no NaN), from_wire returning the same value and type at every depth, agreeing with the
    strict class''s model_validate_json (fields set included); a rebuilt class (model_rebuild) is checked again and
    read by a reader of its new schema; from_wire refuses a DTO instance (it reads JSON data) -, an
    undiscriminated union holding a DTO or a container in any union_mode, a callable discriminator, a DTO
    overriding __init__ or __new__, a mode=before / wrap validator over a DTO or a plain validator, a custom
    serializer or computed field, a wire name that does not round-trip - serialization_alias or validation_alias
    alone, AliasChoices, AliasPath, an alias the model does not read -, an excluded field without a default,
    dataclasses, TypedDicts, NamedTuples, RootModels, unparametrised generics, non-JSON scalars, non-str dict keys,
    sets of non-scalars, and a forward reference left unresolved), one producer per channel and module, a
    stated producer outside its module is refused (SANDLOOM-B015); a view never publishes (SANDLOOM-C025 at run
    time). A producer registers its wire schema (E.wire_schema(): the serialization schema, so a
    defaulted field is required, with no additionalProperties: false, so a reader accepts a newer
    producer''s added optional field; construction stays strict), and it is snapshotted
    (module.snapshot.json) and exported to the shared DTO package; a change on the same .vN other than
    an added optional field fails before anything is written (SANDLOOM-T005), in dev and CI, at every depth:
    $ref / $defs are resolved, so a referenced enum''s values or a nested DTO''s field types, removals and
    newly required fields fail like top-level ones, while an added defaulted (optional) field passes at
    any depth - a default of any kind, literal or factory (round 7: Field(default_factory=list / dict /
    set / a model) carries no JSON default, so the wire schema marks every defaulted property
    "x-sandloom-default": true and the rule and the live schema registry read that mark; a new reader fills
    the field in an old payload, an old reader ignores it in a new one, while the same field added
    without a default still fails as newly required); a field that loses its default fails - literal or
    factory, top level or nested - although the serialization schema''s required list is unchanged, since a
    producer from before the field omits it (round 8: the rule and the live schema registry, which also compares
    every shared $defs entry, read the lost mark), while adding a default to a required field passes; the mark is
    framework-owned: a json_schema_extra that sets "x-sandloom-default" (a field, a nested model, a callable) is refused
    at class definition (SANDLOOM-B015), so it always means "has a default"; readers ignore unknown keys at every depth (round 9: from_wire validates once with a lenient twin of the
    class''s own validation schema, in which every extra="forbid" DTO - nested, in discriminated unions, lists,
    dicts, tuples and recursive definitions - ignores extra keys while extra="allow" ones keep theirs; aliases,
    discriminators and validators are the class''s own and run once, the result and every nested value are
    instances of their real classes, equal to constructed ones, and a real error is raised as is; a FailFast list of
    any length reads; round 10: the reader is built when the class is defined and compiling it modifies no class -
    its model nodes name factory classes whose __new__ allocates the real class, which pydantic-core fills and
    post-inits - so concurrent first decodes never cache a strict reader, nothing in the reader is strict (a
    strict=True DTO reads its published strings), and a self-check verifies that pydantic-core contract on a canary
    before the first reader is stored, failing loudly with the pydantic versions if an upgrade breaks it), so an
    optional field added inside a strict nested DTO is safe for its old reader, the live schema registry compares enum members as JSON values (a list or object
    member, mixed types), and the wire schema carries no additionalProperties: false at any depth; a recursive DTO (self- or mutually recursive) is compared once per ($ref old, $ref new)
    pair on a descent, so it never recurses forever and a change inside the cycle still fails; a
    validation constraint that narrows the accepted values fails (a bound raised / lowered or added,
    inclusive to exclusive, minLength / maxLength / minItems / maxItems / minProperties / maxProperties
    tightened or added, multipleOf added or no longer dividing the old one, pattern added or changed,
    uniqueItems or additionalProperties: false added; format and const changes fail as type changes),
    and so does one that loosens them (round 6: producers and consumers of one .vN deploy
    independently, so the rule holds both directions - a new reader accepts every payload an old
    producer may send AND an old reader accepts every payload a new producer may send: a loosened
    or removed bound, size, multipleOf, pattern, uniqueItems, additionalProperties: false,
    dependentRequired, contains or then / else / dependentSchemas constraint fails, and a model''s
    field is never removed, open to extra keys or not - removing a required field from an
    extra="allow" model fails since the new producer omits it and the old reader requires it, and an
    optional field added to a model whose old schema forbids extra keys fails); every subschema applicator is traversed with the same rule
    (round 3) - a dictionary''s key constraints (propertyNames) and its regex-keyed values (patternProperties:
    a value change under a pattern fails, an added, changed or removed key pattern fails),
    tuple positions (prefixItems), contains (added or narrowed) / minContains / maxContains, then / else,
    dependentSchemas and dependentRequired (added or narrowed), unevaluatedItems / unevaluatedProperties
    (narrowed, or false added) and items: false added, while any change of a not or if subschema fails; required is compared in every subschema with or
    without properties (round 4) - a dictionary''s or a dependentSchemas / then / allOf subschema''s added required
    name fails - an added property is compared with the schema that governed that key (a dictionary''s
    additionalProperties or matching patternProperties, {} below an overlaying applicator), only a closed DTO
    (no additionalProperties, or false) may gain an optional field no old producer sent - a model open to extra
    keys (extra="allow": additionalProperties true or a schema) is an open object, so a field it newly declares is
    compared with what its old additionalProperties allowed (true: only a field accepting anything passes; round
    5) -, a keyword beside a $ref is compared on its own, and a removed key pattern''s keys are
    compared with the new additionalProperties; a differential test holds the rule to the framework validator -
    for every pair of a corpus of mutated pydantic wire schemas (every narrowing and loosening keyword at every
    position and under every applicator, plus hypothesis-composed chains; extra="allow" models, field removals,
    and additionalProperties true / a schema added to a DTO, included) the rule accepts, no payload sampled from the
    old schema fails the new one and no payload sampled from the new schema fails the old one (round 6; the
    sampler sends undeclared keys for a dictionary or an open model; round 8: the sampler omits defaulted fields
    as a producer from before them would, readers fill them, and the corpus removes defaults); the differential
    also runs on pairs of real Event classes with the REAL readers (from_wire of the old and new class: additions in
    strict, lax and open nested DTOs, lists, unions and dicts - round 10: every allowed shape - each scalar and container of scalars beside an added field, a DTO alone,
    optional, in lists, variadic and fixed tuples, dicts, deep containers and FailFast lists, discriminated unions
    alone, optional, in lists and dicts, strict, lax, open, aliased, recursive, validated and two-level nested DTOs
    -, and Decimal / UUID / Enum retypings, which fail (a Decimal is format: decimal in the wire schema, so its
    retyping to str is a type change the old Decimal reader would reject), default removals, added required and removed
    fields), and every such class''s wire schema accepts exactly what its real reader accepts, an undeclared key at
    every depth included; the static view check (SANDLOOM-C025) sees fields inherited from a same-file abstract base. A
    field named like the Event API (channel, meta, publish, wire_schema) is refused at class definition,
    abstract bases included, with SANDLOOM-B015 naming the name and the fix (another name, or Field(alias=...)).'
  sources:
