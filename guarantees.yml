- id: G-MSTORE-08
  statement: 'Projection apply converges: full-state events replace a group''s owned fields iff the stored version
    is NULL or older, so any interleaving with duplicates ends at the max-version event per group, on a relational
    model and on a conditional_write store alike (an independent group''s upsert never clears another group''s
    tombstone); every column has exactly one owning group (SANDLOOM-B012); delta mappers
    are accepted only for a relational projection under the durable inbox (exactly once by the inbox) and refused
    on a store target.'
  sources:
  - docs/adr/0010-public-api-1.0.md#6. Guarantees as a lattice, labels derived from mechanisms (amends ADR-0005)
  - tests/fixtures/specs/public-api-1.0-spec.md#6.4 Projection convergence model
  tests:
