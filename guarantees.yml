- id: G-RPC-01
  statement: 'The request key K_req is HKDF-SHA256 over the X25519 agreement of caller and provider with
    a role-ordered, direction-labelled info naming both services and kids: both sides derive the same
    key, the reverse direction and swapped ids give different keys, and it is domain-separated from the
    response-binding key (committed test vectors pin the schedule).'
  sources:
  - docs/adr/0004-rpc-pair-mac-request-authentication.md#Key schedule
  - docs/operate/service-rpc.md#Request authentication and idempotency
  tests:
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_both_sides_derive_the_same_directional_pair_key
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_request_key_is_domain_separated_from_the_response_binding_key
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_swapped_ids_and_wrong_direction_key_are_refused
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_committed_vectors
- id: G-RPC-02
  statement: 'Low-order / non-canonical X25519 points and an all-zero shared secret never yield a usable
    pair key: they are refused at startup for every configured pair and at verification for a published
    caller key.'
  sources:
  - docs/adr/0004-rpc-pair-mac-request-authentication.md#Key schedule
  - docs/adr/0004-rpc-pair-mac-request-authentication.md#Threat model
  tests:
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_low_order_points_never_yield_a_predictable_key
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_all_zero_agreement_is_refused_even_if_the_library_returned_it
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_low_order_published_caller_key_is_refused_at_verification
- id: G-RPC-03
  statement: The MAC input is a fixed-arity length-prefixed (injective) encoding of caller, caller kid,
    provider, provider kid, HTTP method, target, nonce, raw context bytes and body SHA-256; tampering
    with any one field makes the request fail verification.
  sources:
  - docs/adr/0004-rpc-pair-mac-request-authentication.md#Request MAC
  tests:
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_encoding_is_injective_on_classic_ambiguities
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_encoding_round_trips_and_never_collides_fuzz
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_mac_input_fields_all_change_the_encoding
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_each_tampered_mac_field_is_refused
- id: G-RPC-04
  statement: The provider verifies the single canonical X-SANDLOOM-RPC-Auth header and full 32-byte tag over
    the raw bytes before decoding the context or body; malformed headers, non-canonical/truncated tags,
    a nonce that is not 128-bit lowercase hex, unknown kids and contexts with duplicate JSON keys are
    all 401 rpc_auth_invalid.
  sources:
  - docs/adr/0004-rpc-pair-mac-request-authentication.md#Request MAC
  - docs/adr/0004-rpc-pair-mac-request-authentication.md#Errors
  - docs/operate/service-rpc.md#Request authentication and idempotency
  tests:
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_malformed_headers_and_tags_are_refused
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_non_canonical_tag_encoding_is_refused
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_unknown_kids_are_refused
  - src/sandloom/core/tests/test_rpc_pair_mac.py::test_context_with_duplicate_keys_is_refused
- id: G-RPC-05
  statement: 'Requests are audience-bound by construction: a request MACed for provider P never verifies
    at another service Q (aud must equal RPC_SERVICE_ID, the key names P), and a compromised peer cannot
    forge another caller''s request to a third service.'
  sources:
  - docs/adr/0004-rpc-pair-mac-request-authentication.md#Request MAC
  - docs/adr/0004-rpc-pair-mac-request-authentication.md#Threat model
  - docs/reference/security-model.md#Service-to-service trust (internal RPC)
  tests:
