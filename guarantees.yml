- id: C-DEPLOY-07
  statement: An sandloom new application splits into microservices with no code change. sandloom add deploy <module>...
    --service <name> creates the app's microservices profile, nginx gateway and database init script from
    templates shipped in the package, then derives each service (its own database and migrate one-shot, RPC
    keys, worker and one beat), SERVICE_BINDINGS (plus the issuer's remote claims), RPC_ALLOWED_CALLS and the
    gateway routes from what the modules provide and consume. A repeated run changes nothing, a module is added
    to a service incrementally, hand edits outside the generated blocks are kept and an edit inside one is refused
    with a diff. The framework's own profile is the same generator's output. Route collection covers every
    route a service's app serves (round 3) - root-level routes (/ and /{slug} of module_router(prefix="")) get
    location = / and the catch-all location / (the internal surfaces then answering 404 explicitly), two
    services claiming the same route prefix, / or root-level parameter paths are refused with SANDLOOM-T014 naming
    them, never silently dropped, and a static catch-all left outside the generated routes block is refused.
    Each route prefix's locations stop at its segment boundary as Starlette matches (round 4) - location = /shop
    (to the service whose routes match the bare prefix) and location /shop/, never an unbounded location /shop,
    so /shopping stays with a root-level /{slug} service.
  sources:
  - docs/operate/split-into-services.md
  - deploy/README.md
  tests:
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_first_deploy_creates_the_profile_gateway_and_init_script
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_a_split_app_passes_the_framework_split_invariants
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_rerunning_is_idempotent
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_adding_a_module_is_incremental_and_keeps_hand_edits
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_a_hand_edit_inside_a_generated_block_is_refused_with_a_diff
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_the_framework_profile_is_the_generators_output
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_dev_env_covers_every_required_variable
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_a_root_level_module_gets_the_root_and_the_catch_all
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_two_services_claiming_root_level_paths_conflict
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_a_hand_written_catch_all_outside_the_block_is_refused
  - src/sandloom/core/tests/test_scaffold_deploy.py::test_a_route_prefix_matches_only_its_own_segment
  - tests/e2e/test_app_split.py::test_an_sandloom_new_app_splits_into_microservices
- id: C-DEPLOY-08
  statement: A microservices profile is checked against the split invariants the framework's own profile is pinned
    to (SANDLOOM-T014), in sandloom test's schema & deploy step for an application's profile too, and every HTTP service
    boots alone with exactly its environment (settings, startup preflight, composition root, every consumed
    contract bound) without network. The gateway check compares the gateway with every route each service's
    app serves (root-level / and /{slug} included), never a prefix-filtered list (round 3), and samples
    adversarial paths (round 4) - each path parameter also takes every literal segment a route has at that
    position, bare and suffixed - requiring the upstream to be the service whose app routes match the path
    (Starlette matching, the most literal route winning).
  sources:
