- id: G-SDK-05
  statement: 'Every name sandloom.sdk._decl (L1) imports from sandloom.sdk._prim is exported by a public sandloom.sdk
    module, and every _prim name is public: each L1 dependency is an advertised L2 primitive; the H1
    names (public, at_commit, db, open_uow, sensitive_effect, MoneyLedger, Account, authorizes, ...) are
    the kernel objects themselves, no wrapper.'
