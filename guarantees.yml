    of the request is refused before the cursor (SANDLOOM-R007), unflushed changes at COMMIT included; a read-only
    parent with a child''s sole write is allowed, a child and its parent never both write; declared secondaries
    (allow_multi_db_write) are admitted, before or after the write store (a secondary is never the writer), and
    commit first, the write store last, whatever the endpoint''s parameter order and however the sessions are
    nested in dependencies (either order, any depth, a session shared with the endpoint); a later commit failing after
    a writing unit of the request committed (a partial commit) increments sandloom_multi_store_partial_commit_total{route,store}
    (the route template, each committed store) and logs a warning naming the route, the committed stores and
    the failing store, while a request that commits everything or nothing is never counted; outside a request
    units are unconstrained.'
