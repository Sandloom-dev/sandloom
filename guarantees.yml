- id: G-BILLING-20
  statement: 'billing.credits.v1.spend / get_balance hold a personal account to the end user of the call when
    the call context carries one (the request''s subject locally, the signed caller facts over RPC, carried on
    by every hop: a provider''s own nested calls run for the same end user, with or without a commit-time
    re-check context, so splitting a wrapper never turns a user call into a system call): another user''s id is
    BillingTenantMismatchError (403); system and service callers (no end user anywhere up the chain) are
    unchanged. A command replay never
    bypasses it: the command dedupe record is scoped to the calling end user, so another user reusing a spender''s
    operation key runs the body and gets its own 403, never the stored result (every @command, locally and over
    RPC); the spender''s own retry still replays.'
