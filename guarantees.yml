  statement: sandloom add task <module> <name> [--periodic "<cron>"] writes an idempotent at-least-once task (acks_late,
    reject_on_worker_lost, run_async with an open_uow block) that passes the app's static gates, registers a
    periodic one in the module's setup_periodic_tasks, and wires the beat or prints the step.
  sources:
  - docs/modules/background/tasks.md
  tests:
  - tests/sdk/test_sdk_generators.py::test_add_task_writes_an_idempotent_task_and_its_schedule
  - tests/sdk/test_sdk_generators.py::test_a_fully_generated_app_passes_the_static_gates
- id: C-GEN-10
  statement: The quickstart sandloom new prints is the documented one (one source) and passes as printed in an empty
    directory - uv sync, sandloom add module, sandloom test, migrations, the app serving /health and an authenticated
    round trip, sandloom test --ci - with the dev services' ports configurable.
  sources:
  - docs/getting-started/index.md
  tests:
  - src/sandloom/core/tests/test_quickstart.py::test_the_docs_quickstart_is_what_sandloom_new_prints
  - src/sandloom/core/tests/test_quickstart.py::test_dev_service_ports_are_configurable
  - src/sandloom/core/tests/test_quickstart.py::test_sandloom_new_writes_the_generated_files
  - src/sandloom/core/tests/test_quickstart.py::test_quickstart_end_to_end
- id: C-GEN-11
  statement: sandloom add module generates a list route (GET /items) whose limit is capped with Query(le=...) over its
    TenantScoped table, newest first in a deterministic order (the model uses the framework's idiom - id defaults to
    new_id, a UUIDv7, and created_at is Mapped[CreatedAt], which defaults to clock_timestamp(), so rows created in
    one transaction do not tie - and the list orders by created_at then id), and a test that covers the order of
    rows created in one transaction, the page size, the cap (422) and another tenant's empty list.
  sources:
  - docs/modules/create.md
  - docs/modules/database/conventions.md#Timestamps, ids and list order
  tests:
  - tests/sdk/test_sdk_generators.py::test_add_module_lists_items_capped_and_tenant_scoped
  - tests/sdk/test_sdk_generators.py::test_add_module_lists_newest_first_deterministically_in_one_transaction
  - tests/sdk/test_sdk_generators.py::test_a_fully_generated_app_passes_its_tests_up_to_the_h1_stubs
  - tests/sdk/test_sdk_columns.py::test_rows_of_one_transaction_list_in_creation_order
- id: C-GEN-12
  statement: sandloom new --framework-source path writes editable sources, and an editable install copies no sandloom file
    (its .pth puts the live src/sandloom on sys.path), so the app always runs the checkout's current tree, never
    a cached build of the same version; the quickstart job fails when the installed framework is not the checkout.
  sources:
  - docs/getting-started/index.md
  tests:
  - src/sandloom/core/tests/test_quickstart.py::test_framework_path_takes_the_repository_root
  - src/sandloom/core/tests/test_quickstart.py::test_an_editable_framework_install_is_the_live_tree
  - src/sandloom/core/tests/test_quickstart.py::test_quickstart_end_to_end
- id: C-SDK-04
  statement: 'sandloom docs describes what an app calls besides sandloom.sdk names, from the installed packages
    alone (the bundled sandloom.shared and the app''s <app>.shared): sandloom docs contracts / events list the
    generated stubs and exported schemas; sandloom docs <contract> (name or REF constant) prints the import and
    each method''s signature and the provider''s docstring; sandloom docs <channel> prints the fields, the
    producer''s notes (versions, tenant field, ordering field) and a view to copy. Every method and class
    of a bundled contract stub states its semantics.'
  sources:
  - tests/fixtures/specs/public-api-1.0-spec.md#2.5 Zero kernel reads
  tests:
  - tests/sdk/test_sdk_docs_wire.py::test_a_contract_prints_each_method_with_its_semantics
  - tests/sdk/test_sdk_docs_wire.py::test_an_event_prints_its_fields_and_the_producers_notes
  - tests/sdk/test_sdk_docs_wire.py::test_the_listings_name_every_stub_and_schema
  - tests/sdk/test_sdk_docs_wire.py::test_an_app_shared_package_is_read_too
  - tests/sdk/test_sdk_docs_wire.py::test_every_bundled_contract_method_states_its_semantics
- id: C-SDK-05
  statement: 'The sandloom docs recipes with whole files (test-service-or-task, call-contract,
    projection-from-platform-events, event-v2, periodic-task) run as written in a generated app: their
    sandloom add / migrate new lines and # file: blocks in text order, then sandloom generate and sandloom test on
    the whole app and sandloom
    docs from the installed packages (tools/smoke/recipes_check.py, CI job app-recipes).'
  sources:
  - tests/fixtures/specs/public-api-1.0-spec.md#2.5 Zero kernel reads
  tests:
  - tests/sdk/test_sdk_recipes.py::test_the_recipes_check_runs_every_verified_recipe
  - tests/sdk/test_sdk_recipes.py::test_recipe_parts_keep_the_text_order
  - tests/e2e/test_app_recipes.py::test_every_recipe_runs_in_a_generated_app
- id: C-SDK-06
  statement: 'sandloom.sdk ships the id and timestamp idiom: new_id() returns an RFC 9562 UUIDv7 (version 7, RFC 4122
    variant, the current Unix millisecond) that strictly increases within a process (a burst in one millisecond, a
    clock stepping back, a full counter) and orders by time across processes; CreatedAt / UpdatedAt map
    timestamptz NOT NULL columns defaulting to clock_timestamp() (UpdatedAt also on update), compose with
    TenantScoped, autogenerate as server_default=sa.text(''clock_timestamp()''), and rows one transaction
    inserts list in creation order by created_at then id. sandloom docs describes them and the list-order recipe; the
    bundled modules'' chains migrate every such column to the clock_timestamp() default.'
  sources:
  - docs/modules/database/conventions.md#Timestamps, ids and list order
  tests:
  - tests/sdk/test_sdk_columns.py::test_new_id_is_a_uuid7_stamped_with_the_current_millisecond
  - tests/sdk/test_sdk_columns.py::test_ids_of_a_burst_strictly_increase
  - tests/sdk/test_sdk_columns.py::test_the_fallback_orders_one_millisecond_and_a_clock_step_back
  - tests/sdk/test_sdk_columns.py::test_the_fallback_moves_to_the_next_millisecond_when_the_counter_is_full
  - tests/sdk/test_sdk_columns.py::test_ids_of_different_processes_order_by_time
  - tests/sdk/test_sdk_columns.py::test_the_timestamp_columns_default_to_clock_timestamp
  - tests/sdk/test_sdk_columns.py::test_the_columns_compose_with_tenant_scoped
  - tests/sdk/test_sdk_columns.py::test_alembic_autogenerate_renders_clock_timestamp
  - tests/sdk/test_sdk_columns.py::test_rows_of_one_transaction_list_in_creation_order
  - tests/sdk/test_sdk_columns.py::test_sandloom_docs_describes_the_idiom
  - tests/integration/test_migrations_per_chain.py::test_chains_reproduce_orm_schema_exactly
- id: C-GEN-13
  statement: sandloom new writes the app's agent skills (sandloom-new-module, sandloom-quality-gates, sandloom-event-version-roll,
    sandloom-split-deploy), rewritten for the app's paths and commands, to .claude/skills and .agents/skills, and the
    app map names them in one line; sandloom add skills writes them into an existing app, keeping an edited file
    unless --force.
  sources:
  - docs/getting-started/index.md
  tests:
  - src/sandloom/core/tests/test_project.py::test_generated_project_ships_the_app_skills
  - src/sandloom/core/tests/test_project.py::test_sandloom_add_skills_refreshes_an_existing_app
- id: C-GEN-14
  statement: Example apps pass their own gate - every example app (examples/*) and the tutorial app
    (docs/tutorial-app/*) passes the gate an app developer runs, sandloom test --ci --full (generated files checked,
    schema & deploy, the full suite, ruff check without fixing, ruff format, mypy, sandloom check, contract and route
    snapshots, migration drift), in the CI examples job, which lists every such app; a generated contract stub is
    exactly what ruff format writes.
  sources:
  - examples/README.md
  tests:
  - tests/architecture/test_ci_local_runner.py::test_every_example_and_the_tutorial_app_run_their_own_gate_in_ci
  - src/sandloom/core/tests/test_run_tests_cli.py::test_ci_never_writes_so_ruff_check_never_fixes
  - tests/sdk/test_sdk_generated.py::test_a_rendered_stub_is_what_ruff_format_writes
  - tests/sdk/test_sdk_generated.py::test_a_generated_stub_is_ruff_formatted
- id: C-GEN-15
  statement: 'sandloom generate [module ...] writes every generated file - module, route and contract
    snapshots, contract stubs, generated DTO copies, exported event schemas - after the compatibility checks
    (an incompatible change fails with its code and nothing is written; a weaker route policy is refused,
    pointing to sandloom routes snapshot --write); module names narrow it to those modules'' files. sandloom
    test never writes a generated file, dev and --ci alike: a stale or hand-edited one fails, listed under
    "generated files are stale: run `sandloom generate`". Every sandloom add generator (but skills and deploy)
    runs sandloom generate last, and sandloom new writes them through it, so the files are current after
    scaffolding.'
  sources:
  - docs/reference/cli.md
  tests:
  - src/sandloom/core/tests/test_run_tests_cli.py::test_sandloom_test_never_writes_a_generated_file
  - tests/sdk/test_sdk_generated.py::test_a_stale_file_asks_for_sandloom_generate_and_is_left_alone
  - tests/sdk/test_sdk_generated.py::test_generate_refuses_a_weakened_route_and_names_the_approval
  - tests/sdk/test_sdk_generated.py::test_an_incompatible_change_fails_before_anything_is_written
  - tests/sdk/test_sdk_generators.py::test_sandloom_add_runs_generate_at_the_end
  - tests/sdk/test_sdk_generators.py::test_add_contract_writes_the_generated_stub
  - src/sandloom/core/tests/test_quickstart.py::test_sandloom_new_writes_the_generated_files
- id: C-MODULE-10
  statement: A route policy's atoms add the contracts they resolve to the module's derived consumes as optional
    requirements (SubscriptionActive / Credits the entitlements contract, Entitled the fact owner's facts.v1,
    Subscribed billing.facts.v1, OrgRole the membership contract).
  sources:
  - docs/modules/http/authorization.md
  tests:
  - tests/sdk/test_sdk_discovery.py::test_route_policies_add_the_contracts_their_atoms_call
- id: C-MODULE-11
  statement: identity.contact.v1 answers a user's contact details (email, name, email_verified, is_active) by id,
    locally and over RPC alike, so a module that writes to users needs no PII in events and no identity edit.
  sources:
  - docs/reference/testing.md
  tests:
  - src/sandloom_identity/tests/test_contact_contract.py::test_get_contact_and_get_contacts
  - src/sandloom_identity/tests/test_contact_contract.py::test_contact_contract_conforms
- id: C-MODULE-12
  statement: 'Module ecosystem: a module distribution registers its module in the sandloom.modules entry-point
    group (name = import path); its entry-point name is its module name (tables, migration chain, channels,
    contracts), SANDLOOM_MODULES / MODULE_REQUIRED / deploy profiles may name it by that name or by import path,
    and a requested name with two providers (two installed packages, or an installed package and a local module)
    is refused before anything loads (SANDLOOM-B020), naming both and the fix.'
  sources:
  - docs/modules/index.md
  - docs/reference/error-codes.md#sandloom-b020
  tests:
  - src/sandloom/core/tests/test_module_names.py::test_module_name_is_the_entry_point_name_else_the_last_segment
  - src/sandloom/core/tests/test_module_names.py::test_entry_point_names_and_import_paths_resolve_alike
  - src/sandloom/core/tests/test_module_names.py::test_two_packages_providing_one_requested_name_are_refused
  - src/sandloom/core/tests/test_module_names.py::test_a_local_module_named_like_an_installed_one_is_refused
  - src/sandloom/core/tests/test_module_names.py::test_the_loader_refuses_an_ambiguous_module_before_loading_anything
  - src/sandloom/core/tests/test_module_names.py::test_configuration_names_installed_modules_by_entry_point_name
  - tests/sdk/test_sdk_module_names.py::test_the_sdk_owner_rule_agrees_with_the_kernel
- id: C-MODULE-13
  statement: 'Distributions are layered and work installed alone: no module a distribution ships imports (module
    level, function-local or a constant-string dynamic import) a module of a distribution it does not depend on,
    nor a first-party module no distribution ships, nor an undeclared third-party package outside an ImportError
    guard; pip install sandloom alone (no module package, no Redis/Celery) runs every sandloom subcommand''s
    --help, sandloom docs <name> and sandloom new; sandloom[standard] composes the installed modules; an app''s
    sandloom check treats an installed module package as another module.'
  sources:
  - packages/README.md
  - docs/adr/0001-framework-distribution.md#2. Package graph (monorepo + uv workspace, N wheels, independent
    versions)
  tests:
  - tests/architecture/test_distribution_imports.py::test_a_kernel_import_of_a_module_package_is_caught
  - tests/architecture/test_distribution_imports.py::test_the_lazy_cli_import_of_an_absent_distribution_is_caught
  - tests/architecture/test_distribution_imports.py::test_an_unshipped_first_party_module_is_caught
  - tests/architecture/test_distribution_imports.py::test_undeclared_third_party_is_caught_unless_optional
  - tests/integration/test_package_distributions.py::test_every_distribution_installs_and_runs_alone
  - tests/architecture/test_archcheck_library.py::test_framework_imports_catch_from_sandloom_import_and_dynamic_aliases
  - tests/architecture/test_archcheck_library.py::test_test_imports_is_a_whitelist
- id: C-SDK-03
  statement: sandloom.sdk.tasks.shared_task is Celery's decorator typed with the task's signature (call, delay,
    apply_async, s), so a task module type-checks under strict mypy with no project override; cron() builds a
    beat schedule from a five-field expression.
  sources:
  - docs/modules/background/tasks.md
  tests:
  - tests/sdk/test_sdk_generators.py::test_a_fully_generated_app_passes_the_static_gates
- id: C-MIGRATE-09
  statement: sandloom migrate new autogenerates against a scratch database with every chain at head, so it needs no
    configured database at head (--against-database keeps that comparison) and loads the project's .env.test like
    sandloom test.
  sources:
  - docs/modules/database/write-migration.md
  tests:
  - tests/integration/test_migration_revision_cli.py::test_new_autogenerates_against_a_scratch_database
- id: C-PROJ-09
  statement: A projection source group names its tenant field (tenant_from=, e.g. organization_id) and the consumer
    binds that tenant; a source whose version field is optional or which lacks the tenant field is refused at
    definition time with the alternative.
  sources:
  - docs/modules/between/projections.md
  tests:
  - tests/sdk/test_sdk_projections.py::test_a_source_names_its_tenant_field
  - tests/sdk/test_sdk_projections.py::test_an_optional_version_is_refused_with_the_alternative
- id: C-EVENT-04
  statement: tenancy.member_added / member_removed / member_role_changed .v2 (tenant_id, required per-membership
    version) are dual-published with v1, and billing.subscription.*.v1 carry the catalog plan in data.plan.
  sources:
  - docs/modules/standard/tenancy.md
  - docs/modules/standard/billing.md
  tests:
  - src/sandloom_tenancy/tests/test_registration_surface.py::test_registration_surface_is_pinned
  - src/sandloom_billing/tests/test_entitlement_intentless.py::test_subscription_events_carry_whether_the_subscription_grants
removed:
- id: C-TEST-04
  statement: sandloom.core.testing.assert_operation_classes(app) fails an app with an unclassified or contradictorily
    classified route; sandloom new generates the check.
  reason: 'superseded by C-TEST-07 (ADR-0009, accepted by the owner; spec §9.2): ADR-0009 removes
    assert_operation_classes outright; apps assert deny-by-default with
    sandloom.sdk.testing.route_policy(route) and pin their routes with assert_route_snapshot (C-TEST-07).'
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: C-TEST-07
- id: G-GUARD-03
  statement: create_app refuses (FinancialGuardError) an operation_class('F') route with a response-storing
    cache guard or a fail-open guard.
  reason: superseded by G-SENS-05 (ADR-0009, accepted by the owner; spec §9.2)
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: G-SENS-05
- id: G-IDEM-13
  statement: create_app refuses an operation_class("F") route whose idempotency guard is the response-storing
    cache form or fail-open (FinancialGuardError); durable=True or store_response=False + fail_closed=True
    are accepted.
  reason: superseded by G-SENS-05 (ADR-0009, accepted by the owner; spec §9.2)
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: G-SENS-05
- id: G-OPCLASS-01
  statement: Every API route of the composed monolith (kernel ops routes + identity + tenancy + billing) declares
    exactly one ADR-0003 operation class (P/R/RS/W/F/A) on the route or its router; an unclassified route fails
    CI, and apps run the same gate via sandloom.core.testing.assert_operation_classes(app).
  reason: superseded by G-ROUTE-01 (ADR-0009, accepted by the owner; spec §9.2)
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: G-ROUTE-01
- id: G-OPCLASS-02
  statement: create_app refuses (OperationClassError) a route with two different classes, an unknown class,
    a revocation_freshness budget outside class R, or a class RS/W/F/A route that is not always-strict.
  reason: superseded by G-ROUTE-01 / G-ROUTE-04 (ADR-0009, accepted by the owner; spec §9.2)
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: G-ROUTE-01, G-ROUTE-04
- id: G-REVOKE-13
  statement: 'revocation_freshness(max_staleness_s=N) requires 0 < N <= 5 (else ValueError) and may be declared
    only on GET/HEAD routes: create_app refuses a budget on any other method or on a router with a write route
    (RevocationPolicyError).'
  reason: superseded by G-REVOKE-21 (ADR-0009, accepted by the owner; spec §9.2)
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: G-REVOKE-21
- id: G-REVOKE-14
  statement: A budgeted route answers from a per-process mark copy only while it is younger than the budget
    at DECISION time (re-checked after the live block read); a copy is never extended, and a copy expired or
    invalidated while a read was in flight is replaced by a live read of the mark.
  reason: superseded by G-REVOKE-21 (ADR-0009, accepted by the owner; spec §9.2)
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: G-REVOKE-21
- id: G-REVOKE-15
  statement: revoke_user_tokens drops the local copy and broadcasts on Redis pub/sub (sandloom:auth:revocations);
    other processes drop theirs, a lost broadcast delays a revocation on budgeted routes by at most the budget,
    only a drop of the same subject (or a wholesale clear on (re)subscribe) discards an in-flight read.
  reason: superseded by G-REVOKE-21 (ADR-0009, accepted by the owner; spec §9.2)
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: G-REVOKE-21
- id: G-REVOKE-16
  statement: A route marked always-strict (Depends(strict_revocation()) on it or its router, or a path under
    AUTH_REVOCATION_STRICT_PATH_PREFIXES) ignores a revocation_freshness budget (logged at startup) and always
    reads the mark live.
  reason: superseded by G-REVOKE-21 (ADR-0009, accepted by the owner; spec §9.2)
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: G-REVOKE-21
- id: G-REVOKE-20
  statement: 'Per-request revocation cost: a strict route does one Redis round trip (MGET of revocation + block
    marks); a budgeted route with a fresh local copy does one GET of the block mark.'
  reason: superseded by G-REVOKE-21 (ADR-0009, accepted by the owner; spec §9.2)
  approved_by: owner (ADR-0009 / ADR-0010 approval, 2026-10-25)
  date: '2026-10-26'
  replaced_by: G-REVOKE-21

