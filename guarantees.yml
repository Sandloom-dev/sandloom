- id: G-ROUTE-04
  statement: 'Each module''s routes.snapshot.json (format 3) records the static resolved policy per
    route and method: auth, effect, session, risk with its sources, idempotency (mode), audit,
    step_up_max_age_s, public_reason, issues_tokens, operation_intent, write_store, multi_db_write, and
    authz (the custom authorization dependencies marked with sandloom.sdk.web.authorizes, in resolution
    order); drift, including a weakening such as a dropped risk, fails the module''s tests with the fix
    (SANDLOOM-T001). sandloom generate never writes a weaker policy over the committed snapshot, and sandloom
    test never writes any generated file (authentication
    removed or the route made public, a risk removed, idempotency removed / no longer fail-closed / no
    longer durable, the session check weakened, the automatic audit dropped, step-up removed or relaxed,
    an authorization dependency removed): sandloom generate fails with SANDLOOM-T001 before anything is
    written, names sandloom routes snapshot --write, and sandloom test fails, until sandloom routes snapshot
    --write approves it explicitly, naming each approved weakening (the snapshot
    diff records it). Idempotency is compared by its properties (present, fail-closed, durable), derived
    from every mode the snapshot writes (none / none (reason), automatic S and automatic B (reason): a
    durable fail-closed record; explicit durable / cache / in-flight with or without fail-closed: only the
    durable kind is durable); losing any property is a weakening whatever the spelling (automatic S to
    explicit in-flight, fail-closed loses durability), and an unknown mode is never accepted silently.'
  sources:
  - docs/adr/0009-route-policy-and-session-freshness.md#The route snapshot
  - docs/adr/0009-route-policy-and-session-freshness.md#Checks (deterministic; each error names its fix)
