  - src/sandloom/core/tests/test_projection_kernel.py::test_a_large_write_gets_no_token_and_no_key_means_no_token
  - src/sandloom/core/tests/test_projection_kernel.py::test_a_read_waits_only_for_its_own_projections_missing_versions
  - tests/sdk/test_sdk_projection_ops.py::test_a_write_token_names_the_rows_its_events_produce
  - tests/sdk/test_sdk_projection_ops.py::test_a_write_route_sets_the_token_header
  - tests/sdk/test_sdk_projection_ops.py::test_a_read_waits_for_the_token_then_serves_stale
  - tests/sdk/test_sdk_projection_ops.py::test_the_token_digest_is_the_kernels
  - src/sandloom/core/tests/test_projection_kernel.py::test_a_wait_compares_each_source_group_with_its_own_version
  - tests/sdk/test_sdk_projection_ops.py::test_a_token_of_one_group_is_not_satisfied_by_another_groups_version
  - tests/sdk/test_sdk_projection_ops.py::test_a_store_token_compares_its_own_groups_version
  - tests/sdk/test_sdk_projection_ops.py::test_a_waiting_read_rereads_until_its_group_catches_up
