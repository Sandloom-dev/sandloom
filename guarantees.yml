  - src/sandloom/core/tests/test_projection_watermarks_db.py::test_racing_rebuild_marks_are_counted_exactly
  - tests/sdk/test_sdk_projection_ops.py::test_the_relational_purge_deletes_tombstones_older_than_the_cutoff
  - tests/sdk/test_sdk_projection_ops.py::test_a_store_purge_deletes_old_tombstones_only
  - tests/sdk/test_sdk_projection_ops.py::test_an_event_older_than_the_watermark_is_refused_on_apply
  - tests/sdk/test_sdk_projection_ops.py::test_only_a_projection_with_tombstones_gets_the_guard
  - tests/sdk/test_sdk_projection_purge_race.py::test_a_purge_racing_an_apply_never_resurrects_a_relational_row
  - tests/sdk/test_sdk_projection_purge_race.py::test_a_purge_racing_an_apply_never_resurrects_a_store_row
