  - src/sandloom/core/tests/test_tenant_isolation.py::test_insert_cannot_target_another_tenant
- id: G-TENANT-05
  statement: Under a bound tenant, bulk INSERTs, bulk UPDATEs that change tenant_id (values or ordered_values)
    and bulk-by-primary-key UPDATEs on a TenantScoped model raise UnsafeTenantOperationError; they are
    only allowed inside explicit unscoped().
  sources:
  - docs/modules/database/multi-tenancy.md
  tests:
