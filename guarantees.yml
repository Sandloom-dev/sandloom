- id: G-MSTORE-07
  statement: 'Consistency tokens never become an error: SANDLOOM-Consistency-Token is HMAC-SHA256 under PROJECTION_TOKEN_KEYS
    (the newest kid signs, every listed kid verifies), expires after 600 s, carries at most 16 entries (a larger
    write gets none) and is ignored when missing, malformed, forged, expired, of an unknown kid or of another tenant;
    a write route whose pending events feed a projection answers with the token of the rows they produce, each entry
    naming its source group and aggregate; a read presenting it waits at most wait_ms (PROJECTION_RYW_WAIT_MS) until
    each entry''s own group version column reaches it (never another group''s version; a page read rereads its rows
    every poll round and a relational read reloads the rows its session already holds, so a cached row behind
    the token catches up within the budget), then serves with
    SANDLOOM-Projection-Stale: true (on_stale="serve") or reads the entity from its source (on_stale="source").'
  sources:
  - docs/adr/0010-public-api-1.0.md#6. Guarantees as a lattice, labels derived from mechanisms (amends ADR-0005)
  - tests/fixtures/specs/public-api-1.0-spec.md#6.4 Projection convergence model
  tests:
