- id: G-SENS-04
  statement: 'Every sensitive write gets exactly one automatic, mandatory audit row (sandloom.sensitive_write) in the
    request''s writing unit: actor, route template, method, path parameters, risks with their sources and the route''s
    status; never the body; no row for a read or a refused request; a money command marks the caller''s request
    alike locally and remotely (from the describe document before the call, and from the MAC-bound risks of the
    response: every risk the remote execution observed, its nested calls'' included, so an untagged command calling
    a money command marks the request as it would locally; the risks travel on error responses too, merged
    before the caller raises, so a wrapper that raises after its nested money command committed still marks
    the request; a command REPLAY, local or remote (the proxy''s automatic retry after a lost answer included),
    marks the caller exactly like its first execution: the durable command record (and the cache fallback) keeps
    the risks the execution observed and the replay re-applies them, its on_commit callbacks'' included (round 5:
    the cache record is written after the callbacks ran; the durable record commits with the body''s effects plus
    what each queued callback declares - a @sensitive_effect callback''s risk and step-up, fail closed - and is
    corrected with what the callbacks actually left once they ran, a closure''s included; a process death between
    the commit and that correction replays the declared callbacks'' risks and nothing of a closure; round 6: the
    correction - and the cache record - is written on EVERY exit after the commit, a cancelled callback (a request
    timeout) included, with what the callbacks left until then plus what the queued ones declare when they did not
    all finish (fail closed), in a task shielded from the caller''s cancellation (anyio cancels again at every
    await), bounded (5 s) and never raising into the caller: a closure that completed a money effect before its
    request was cancelled is on the record, so a later replay owes the audit too)), so the audit
    does not change after a split
    or a retry; such a command commits in its own unit, as does
    a risky effect run inside any contract unit (locally too), so the
    request writes its row even when its own units wrote nothing (the route runtime opens the request unit
    when the handler opened none).'
  sources:
