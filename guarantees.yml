  - src/sandloom/core/tests/test_tenant_guard_gaps.py::test_bound_relationship_loads_are_scoped
  - src/sandloom/core/tests/test_tenant_guard_gaps.py::test_session_get_identity_map_hit_is_rechecked
- id: G-TENANT-04
  statement: An ORM object insert of a TenantScoped model inherits the bound tenant, fails with MissingTenantError
