- id: G-CONTRACT-19
  statement: 'Contract DTOs are authored in the provider and copied for callers: sandloom generate writes a
    wire-shape copy of every DTO a provided contract signature names (nested ones included) into
    <shared>/contracts/<module>_dto.py, each class marked @dto_copy with its origin, and the stub names the copy
    and passes its Protocol (ContractRef(name, Protocol)). A Contract(REF) caller - and
    Contract(REF, optional=True).client() - receives results as the stub annotates them (the copy''s class), on
    the local path and over RPC (with or without the provider''s package imported in the caller process), equal
    to what the provider returned; a frozen copy of immutable scalars is rebuilt without revalidation, anything
    else through one JSON round trip; a result already of the stub''s class, or naming no model / Enum, is not
    converted. The provider receives its own class for a copy the caller passes, on both paths.'
  sources:
