  - src/sandloom/core/tests/test_tenant_isolation.py::test_bulk_delete_scoped_to_bound_tenant
- id: G-TENANT-03
  statement: 'The ORM guard also covers relationship loads (lazy, selectin, joined), joins, EXISTS/IN
    subqueries, select_from and Session.get (an identity-map hit is re-checked against the bound tenant):
    unbound they fail closed, bound they return only the bound tenant''s rows.'
  sources:
  - docs/modules/database/multi-tenancy.md
  - docs/reference/security-model.md#Tenant isolation
  tests:
  - src/sandloom/core/tests/test_tenant_guard_gaps.py::test_unbound_reach_into_tenant_table_fails_closed
