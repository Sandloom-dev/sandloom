  - tests/architecture/test_api10_checks.py::test_the_trees_pass_the_10_checks_once_unplanned
- id: G-DECL-06
  statement: 'A typed event field with a wire name (Field(alias=...)) round-trips: publish() emits the
    alias, the registered and exported schema names it, and every reader (an @on consumer of the producer
    class or of a view, a projection, published(), deliver()) decodes it back from the wire key; @on and
    a projection bind the tenant from the field''s wire name.'
  sources:
  - tests/fixtures/specs/public-api-1.0-spec.md#5.2 Typed events
  tests:
  - tests/sdk/test_sdk_events.py::test_an_aliased_field_survives_publish_deliver_and_handler
  - tests/sdk/test_sdk_events.py::test_on_binds_the_tenant_by_its_wire_name
  - tests/sdk/test_sdk_testing_kit.py::test_an_aliased_field_survives_the_real_consumer_runtime
- id: G-DECL-07
  statement: 'SANDLOOM-C012. A contract DTO (a model / Enum a @contract signature names, nested ones included,
    except classes of sandloom.shared and generated copies) is held to the closed set of event wire shapes
    (G-DECL-01) within the contract wire types, plus what its generated copy can carry: no parametrised generic,
    a default the copy can write (JSON scalars, Enum members, UUID / Decimal / date / datetime / time /
    timedelta, containers of them) and default_factory only list / dict / set / frozenset / tuple, Field
    constraints only (no custom annotated constraint, no StringConstraints transformation, no callable
    discriminator, no exclude_if), no Flag enum; anything else is refused when @contract decorates the provider
    (ContractDtoError) naming the method, the field path and the fix. The copy carries fields, types and
    constraints, defaults, aliases (an alias_generator resolved per field), Literal / Enum values, nested and
    discriminated models and the allowed model_config options - never methods or validators, which stay the
    provider''s; over the whole set (a property test over random payloads) the copy accepts and refuses exactly
    what the provider''s class does, in python and JSON mode, and reads accepted payloads to the same data.
    Contract wire dumps use each field''s wire name (by_alias), so an aliased DTO round-trips.'
  sources:
  - docs/modules/between/contracts.md
  - 'docs/adr/0010-public-api-1.0.md#Note (2026-10-28): contract DTOs authored in the provider, generated into the DTO package'
  tests:
  - tests/sdk/test_sdk_contract_dtos.py::test_a_dto_the_copy_cannot_carry_is_refused_with_its_path
  - tests/sdk/test_sdk_contract_dtos.py::test_the_copy_accepts_exactly_what_the_provider_accepts
  - tests/sdk/test_sdk_contract_dtos.py::test_every_copied_class_is_marked_and_carries_the_wire_shape
  - tests/sdk/test_sdk_contract_dtos.py::test_a_validator_stays_the_providers
  - tests/sdk/test_sdk_contract_dtos.py::test_a_caller_receives_the_copy_equal_to_the_providers_value
- id: G-MODULE-19
  statement: 'An application derives its module list: sandloom.sdk.app.app_modules("<app>.modules") finds,
    statically, every subpackage whose __init__ defines register; sandloom new passes it to create_app as the
    default (SANDLOOM_MODULES selects a subset).'
  sources:
  - tests/fixtures/specs/public-api-1.0-spec.md#5.7 The application manifest and discovery
  tests:
  - src/sandloom/core/tests/test_project.py::test_minimal_app_loads_only_its_module
  - src/sandloom/core/tests/test_project.py::test_with_batteries_orders_modules
- id: G-MIGRATE-12
  statement: 'sandloom migrate drift (and the sandloom test step "migration drift", SANDLOOM-T006) applies the core
    chain and every module chain, in the upgrade-all dependency order, to a scratch database on the
    default database''s server (created and dropped by the check) and compares each chain with its
    models (each env.py compares only the module''s tables); a difference fails naming the module, the
    operations found and the fix (sandloom migrate new <module> "<message>"). The configured databases are
    never written.'
  sources:
  - tests/fixtures/specs/public-api-1.0-spec.md#5.6 Generated migrations with RLS
  - tests/fixtures/specs/public-api-1.0-spec.md#5.8 `sandloom test`
  tests:
  - tests/sdk/test_sdk_generators.py::test_migration_drift_names_the_module_and_the_fix
  - src/sandloom/core/tests/test_run_tests_cli.py::test_the_plan_of_the_framework_tree
- id: G-AUTHZ-13
  statement: 'The authorization algebra is unchanged (spec §8.3), pinned by properties over random And /
    Or / Not trees of fixed-outcome, evaluation-counting atoms against an independent model of today''s
    rule: the value, the atoms evaluated and their order (cheapest tier first, short-circuit, no extra
    evaluation), fail-closed soundness (an allow holds under every two-valued completion of the
    indeterminate atoms), Not(U) = U, Or allowing on a genuine allow beside an indeterminate, evaluate
    agreeing with decide; the known order dependence (~(F & U) allows, ~(U & F) does not) is kept.'
  sources:
  - tests/fixtures/specs/public-api-1.0-spec.md#8.3 The authorization algebra is unchanged (Q4 revised twice)
  - tests/fixtures/specs/public-api-1.0-spec.md#8.2 Property-based (Hypothesis)
  tests:
  - tests/laws/test_authz_algebra_laws.py::test_value_and_evaluations_equal_the_documented_rule
  - tests/laws/test_authz_algebra_laws.py::test_an_allow_holds_under_every_completion_of_the_indeterminate
  - tests/laws/test_authz_algebra_laws.py::test_not_keeps_an_indeterminate
  - tests/laws/test_authz_algebra_laws.py::test_or_allows_on_a_genuine_allow_beside_an_indeterminate
  - tests/laws/test_authz_algebra_laws.py::test_evaluate_agrees_with_decide
  - tests/laws/test_authz_algebra_laws.py::test_the_known_order_dependence_is_kept
- id: G-SENS-07
  statement: 'Risk is a join: Requirement.risks() is the union over And / Or and empty under Not; a
    route''s resolved risk is the union of its sources (admin gates, @sensitive_effect dependencies,
    sensitive() markers) whatever their order or repetition, each naming its sources; the derived
    step-up is the strictest of its contributors'' (obligations are a homomorphism).'
  sources:
  - docs/adr/0009-route-policy-and-session-freshness.md#Risk is declared at its source, once, by its owner
  - tests/fixtures/specs/public-api-1.0-spec.md#8.2 Property-based (Hypothesis)
  tests:
  - tests/laws/test_risk_join_laws.py::test_requirement_risks_are_a_union
  - tests/laws/test_risk_join_laws.py::test_route_risk_is_the_join_of_its_sources
  - tests/laws/test_risk_join_laws.py::test_obligations_are_a_homomorphism
