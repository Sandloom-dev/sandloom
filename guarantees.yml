- id: G-BILLING-19
  statement: 'The checkout and portal routes are operation_intent routes and take no request unit: each intent step
    is its own short sequential unit, no transaction is nested in another, and none (nor any held connection, checkout
    or row lock) spans the PSP call (external_call) or the final re-read (release_check); write admission refuses
    a unit opened during either (SANDLOOM-R008), including one a racing task opens while the window is entered; a read
    contract already running on the request''s shared read connection finishes and its unit is closed before
    either window opens, and a contract call already running in its own provider unit finishes before either
    window opens (a new one is refused while it is open), whether the call is local or remote (RPC); a remote
    call whose provider left an attempt unanswered (timeout, transport failure, or an answer whose MAC-bound
    effects the caller could not merge: too large to read, no well-formed envelope, malformed effects, an
    unkeyed refusal - round 5) may still hold its unit, so
    neither window opens in that request (fail closed, 503 SANDLOOM-R008), whichever hop made the unanswered call (a
    provider reports its own nested unanswered calls back, caught or not, and each caller merges them).'
  sources:
  - docs/reference/security-model.md#Authority at commit (admin and money effects)
  - "docs/adr/0003-fewer-sync-rpc-membership-reads.md#Gaps the classification exposed \u2014 resolved"
