- id: G-SDK-04
  statement: 'Generated code (sandloom new, every sandloom add generator) and every example file that imports
    sandloom.sdk use only the 29 beginner names; an advanced name needs `# sandloom: advanced <reason>` on its
    import (SANDLOOM-T009).'
