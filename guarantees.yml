- id: G-MSTORE-10
  statement: 'A store projection is tenant-native: each conditional write names its row''s tenant, a row whose tenant
    is missing or differs from the bound tenant is refused, and store reads return only the bound tenant''s rows:
    a read key or filter naming another tenant never overrides the bound one (it reads nothing, fail closed) and
    a store read without a bound tenant is refused.'
  sources:
  - docs/adr/0010-public-api-1.0.md#6. Guarantees as a lattice, labels derived from mechanisms (amends ADR-0005)
