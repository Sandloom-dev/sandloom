  - tests/sdk/test_sdk_contracts.py::test_optional_returns_a_deployed_provider_even_if_it_will_fail
- id: G-DECL-05
  statement: 'sandloom check SANDLOOM-C021 refuses a function-local import in a business module (typing-only
    imports and a marked optional dependency excepted). SANDLOOM-C021 is un-planned and active in sandloom check:
    the bundled modules (identity, tenancy, billing) and the examples carry no function-local import
    (qrcode keeps a deferred import marked # sandloom: optional-import), so the framework tree and the
    examples report none.'
  sources:
  - tests/fixtures/specs/public-api-1.0-spec.md#5.10 No function-local imports in modules
  tests:
