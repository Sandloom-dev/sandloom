  - src/sandloom/core/tests/test_tenant_isolation.py::test_bulk_update_cannot_change_tenant_id
  - src/sandloom/core/tests/test_tenant_guard_gaps.py::test_bulk_update_by_primary_key_is_refused
  - src/sandloom/core/tests/test_tenant_guard_gaps.py::test_ordered_values_cannot_change_tenant_id
- id: G-TENANT-06
  statement: Core select/insert/update/delete statements (including a raw Table alias mixed into an ORM
    query) against a recognised TenantScoped table under a bound tenant are refused with UnsafeTenantOperationError
