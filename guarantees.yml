- id: G-UNIT-02
  statement: 'Operation-intent mode: no request unit, sequential units; external_call() and release_check() exclude
    any unit, read-scope connection or checkout during their lifetime, the window opening atomically with the no-unit
    check and re-verified after the read-scope drain, so a unit a racing task opens meanwhile is refused (SANDLOOM-R008;
    the authority callback''s read-contract calls excepted); the drain waits for a read contract already running
    on the scope''s shared connection and closes its unit (a window entered from inside that read is SANDLOOM-R008);
    the window also waits for every contract call of the request already running in its provider unit (command
    or read; refused from inside one) and refuses a new one while open, so it never runs beside a provider
    transaction; a REMOTE contract call (the generated RPC proxy) obeys the same rules: refused inside a window
    before it is sent, counted while it runs so a window entered meanwhile waits for it (local == remote),
    and a remote call with an attempt its provider never answered (a timeout, a transport failure: its provider
    unit may still run after the transport gave up) refuses every later window of the request, fail closed (503,
    SANDLOOM-R008; the client retries with its Idempotency-Key), while an answered failure leaves it open, "answered"
    meaning its MAC-bound effects were merged (round 5): an answer whose fx the caller never merged - one larger
    than RPC_MAX_RESPONSE_BYTES (its fx.id lost with it), a reply without a well-formed envelope, malformed fx, or
    an unkeyed (unauthenticated) refusal - counts as unanswered (round 6: fx is malformed when any field is
    unknown or any ENTRY of rk / id / sr / ra / su has the wrong type or exceeds its bound - fx.id [None], a
    17th id, an unknown risk, a non-positive step-up, an ra other than exactly the integer 1 (round 7: 1.0
    and true are malformed) -; its well-formed risks still mark the request, its ra
    never does), so a root catching that 502 / 503 cannot open a
    window beside a nested unit that may still run; at any depth:
    a provider (or a local contract) whose own nested remote call went unanswered reports it back MAC-bound (fx.id)
    even when it caught the failure and answered OK, and every caller up the chain merges it, so the root''s windows
    refuse too (a replay of that provider''s command does not re-raise it: the uncertainty is not a committed
    effect);
    a 2xx outside the issue case (at least one external
    call, release_check after the last, exactly one write after it) or the issued-retry case (no commit after the
    release) is discarded with SANDLOOM-R012; an organization account needs the authority; db() is SANDLOOM-R002; SANDLOOM-B019
    at startup.'
  sources:
  - docs/adr/0010-public-api-1.0.md#4. Transaction and replay lifecycle
