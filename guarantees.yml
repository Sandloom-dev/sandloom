- id: G-SENS-05
  statement: 'Money dedupe is mandatory: a money effect needs a dedupe record (its own operation_key, the request''s
    request_operation_key(), a command key or a ledger key); a client without Idempotency-Key gets 428 (SANDLOOM-R010);
    a route that cannot dedupe the key it got is SANDLOOM-R009 (a route whose only money effect is a command is
    held to the same rules: the command key is its dedupe record); a sensitive("money") write committing without either
    is refused before COMMIT; at startup a money route whose idempotency guard is the response-storing cache
    form or fail-open is refused (SANDLOOM-B019), while durable=True or store_response=False + fail_closed=True
    guards are accepted.'
