- id: G-SENS-03
  statement: 'Security risk: identity''s credential services (password change, 2FA init / enable / disable
    / backup-code regeneration, SSO link / unlink) are @sensitive_effect("security", step_up=300); mark_reauthenticated()
    after the current-password check (or a recent auth_time) satisfies it, so identity''s behaviour is unchanged.
    The step-up is enforced identically when the effect runs in a contract command served over RPC: the signed
    caller facts carry the end user''s auth_time and the request''s re-authentication to the provider, whose
    call runs in a request scope built from them (with or without a commit-time re-check context, on an
    operation-intent route too), so stale auth is 401 and fresh auth or a re-authentication passes, local
    and remote alike; a re-authentication or a pending step-up the remote execution leaves comes back with
    its response.'
