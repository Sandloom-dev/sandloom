- id: G-SAGA-03
  statement: Saga instance tables are reached across tenants only through the audited system channel under
    tenant RLS. On every database, with or without tenant RLS, the runtime itself scopes saga state to the
    bound tenant (round 3) - saga_status and start_saga's create-or-get read only the bound tenant's instance
    (no tenant bound - only a tenant-less saga), so another tenant asking for a business id gets nothing (no
    instance id, status or step) and its start conflicts, and a nudge moves an instance only of the tenant it
    names; only the system channel (sweep, operator commands) and the test harness read across tenants
    (saga_store.ANY_TENANT, a required argument of every instance read). The bound tenant is read once the
    unit is open (round 4) - saga_status outside a unit opens its own, which binds SINGLE_TENANT_ID under
    TENANCY_MODE=single, so a canonical-tenant saga is found, not reported absent.
