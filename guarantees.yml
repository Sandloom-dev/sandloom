  - tests/laws/test_projection_laws.py::test_a_delta_mapper_is_accepted_only_under_the_durable_inbox
  - tests/laws/test_projection_laws.py::test_deltas_under_the_inbox_count_each_event_exactly_once
  - tests/sdk/test_sdk_projections.py::test_full_state_converges_under_shuffles_and_duplicates
