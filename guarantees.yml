- id: G-SDK-02
  statement: 'sandloom.sdk imports only the public kernel surface (no kernel internal, no private submodule
    of a public kernel package); the kernel (sandloom.core, sandloom.shared) never imports sandloom.sdk; L1
    (sandloom.sdk._decl) imports no kernel module; and sandloom.sdk is layered public modules > _decl > _prim.'
