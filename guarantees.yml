- id: G-SAGA-11
  statement: 'A step with an ambiguous outcome is resolved (re-issued with the same key) before it is compensated;
    a timeout racing a completing step is serialized by the row lock; also after a crash that rolled back the attempt
    count: a command step''s first forward call writes a durable started marker in its own transaction, and a deadline
    resolves a step that may have applied (attempt > 0 or the marker) before compensating.'
  sources:
  - docs/adr/0008-sagas.md#7. Recovery rules
  tests:
  - src/sandloom/core/tests/test_sagas_recovery.py::test_ambiguous_step_is_resolved_before_it_is_compensated
  - src/sandloom/core/tests/test_sagas_recovery.py::test_resolve_that_finds_a_refusal_compensates_nothing
  - src/sandloom/core/tests/test_sagas_recovery.py::test_resolved_pivot_that_applied_never_compensates
  - src/sandloom/core/tests/test_sagas_recovery.py::test_timeout_racing_a_completing_step_is_serialized_by_the_row_lock
  - tests/laws/test_saga_laws.py::test_a_deadline_after_a_crash_resolves_the_step_before_compensating
  - tests/laws/test_saga_laws.py::test_steps_are_idempotent_and_status_only_moves_forward
- id: G-SAGA-12
  statement: 'No blind re-call after the command-dedupe TTL: an operator retry of a step with an unknown
    outcome is refused (resolve first), and the runtime parks such a step with outcome_unknown_after_ttl; a
    call whose transition rolled back after the provider committed (only its durable started marker survives)
    is recovered as a transient attempt from the marker''s own time, so recovery after the TTL parks it instead
    of re-issuing the command.'
  sources:
  - docs/adr/0008-sagas.md#8. Operations
  tests:
  - src/sandloom/core/tests/test_sagas_ops.py::test_retry_refuses_an_unknown_outcome_after_the_dedupe_ttl
  - src/sandloom/core/tests/test_sagas_ops.py::test_retry_after_the_ttl_proceeds_when_the_outcome_is_known
  - src/sandloom/core/tests/test_sagas_recovery.py::test_ttl_guard_parks_an_ambiguous_step_whose_record_may_be_gone
  - src/sandloom/core/tests/test_sagas_cli.py::test_post_ttl_retry_exits_1_with_the_resolve_hint
  - src/sandloom/core/tests/test_sagas_recovery.py::test_a_crash_after_the_provider_committed_is_never_reissued_after_the_ttl
- id: G-SAGA-13
  statement: Production refuses a saga whose retry and compensation horizon exceeds the command-dedupe
    TTL unless the risk is accepted.
  sources:
