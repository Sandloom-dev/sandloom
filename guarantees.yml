- id: G-DECL-03
  statement: 'define_module derives consumes from module-level Contract(...) references: name and required exact;
    methods only from direct `<name>.<method>(` calls on the name or a direct alias, any other use giving () (every
    method); merged with explicit consumes never weaker (required ORed, methods unioned or ()); a saga''s contract
    requirements merge into consumes by name the same way.'
  sources:
  - tests/fixtures/specs/public-api-1.0-spec.md#5.3 Typed contracts
  tests:
  - tests/sdk/test_sdk_contracts.py::test_methods_are_derived_from_direct_calls_only
  - tests/sdk/test_sdk_discovery.py::test_consumes_are_derived_and_merged_never_weaker
  - src/sandloom/core/tests/test_saga_requirement_merge.py::test_an_undeclared_contract_is_added_once
  - src/sandloom/core/tests/test_saga_requirement_merge.py::test_a_declared_all_methods_entry_absorbs_the_sagas
  - src/sandloom/core/tests/test_saga_requirement_merge.py::test_methods_union_required_or_and_the_declared_reason_kept
- id: G-DECL-04
  statement: 'Contract(REF, optional=True).client() is None only when the provider is neither local nor
    bound in the deployment (ServiceNotFound / ServiceUnavailableInDeployment); a deployed provider is
    returned even when it will fail (503 on the call).'
  sources:
  - tests/fixtures/specs/public-api-1.0-spec.md#5.3 Typed contracts
  tests:
