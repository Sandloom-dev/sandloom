  - src/sandloom/core/tests/test_scaffold_deploy.py::test_the_checker_samples_paths_that_collide_with_another_prefix
- id: C-DEPLOY-09
  statement: A service added to a running microservices stack gets its database although the Postgres
    volume exists (init-databases.sh runs only on an empty volume) - every generated migrate-<service>
    one-shot runs sandloom migrate upgrade-all --apply --create-databases, which creates each hosting PostgreSQL
    database when missing (idempotent, with the citext and pg_trgm extensions), also in a profile
    generated before (the generated block carries the command). Race-safe (round 3) - provisioning is
    serialized per target name by an advisory lock on the maintenance database, and every caller ensures the
    extensions inside it whether or not it created the database, so a concurrent caller never returns (and
    migrates) before the database is complete.
