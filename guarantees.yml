- id: G-REVOKE-23
  statement: 'Self-revocation is "check, then revoke": a unit revoking its own subject commits after the live
    check passed; a foreign revocation landing before the self-revoking call is still seen; a self-revocation
    inside a rolled-back savepoint contributes nothing; committed units carry the exemption to later units
