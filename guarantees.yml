- id: C-MSTORE-01
  statement: 'Delivery lattice laws (sandloom.core.guarantee_lattice): a guarantee''s delivery set is closed under atomic
    => no_loss and no_dup; the meet is idempotent, commutative and associative, FULL is its unit on deliveries,
    and unknown properties are refused.'
  sources:
  - docs/adr/0010-public-api-1.0.md#6. Guarantees as a lattice, labels derived from mechanisms (amends ADR-0005)
  tests:
  - src/sandloom/core/tests/test_guarantee_lattice.py::test_atomic_implies_no_loss_and_no_dup
  - src/sandloom/core/tests/test_guarantee_lattice.py::test_the_meet_is_a_semilattice_and_never_strengthens
  - src/sandloom/core/tests/test_guarantee_lattice.py::test_unknown_properties_are_refused
- id: C-MSTORE-02
  statement: 'Monotonicity: combining effects (the meet) never raises a guarantee above either operand.'
  sources:
  - docs/adr/0010-public-api-1.0.md#6. Guarantees as a lattice, labels derived from mechanisms (amends ADR-0005)
  tests:
  - src/sandloom/core/tests/test_guarantee_lattice.py::test_the_meet_is_a_semilattice_and_never_strengthens
- id: C-MSTORE-03
  statement: 'Labels are derived from the mechanism, one scenario per row of the label table: only a write-store
    write is atomic; an outbox event is at-least-once (no_loss only with a durable bus); a durable consumer effect
    is no_dup only with the inbox in its database and the inbox outliving the stream; an effect in another store
    is no_dup only through a conditional write; a command is no_dup only with a database command log whose TTL covers
    the retries (never the cache fallback); consumer delivery is always qualified (parks_*); a label is shown only
    where it deviates.'
  sources:
  - docs/adr/0010-public-api-1.0.md#6. Guarantees as a lattice, labels derived from mechanisms (amends ADR-0005)
  - tests/fixtures/specs/public-api-1.0-spec.md#6.3 Labels are derived from the mechanism
  tests:
  - src/sandloom/core/tests/test_guarantee_lattice.py::test_each_row_of_the_label_table
  - src/sandloom/core/tests/test_guarantee_lattice.py::test_a_label_is_shown_only_when_it_deviates
- id: C-MSTORE-04
  statement: A conditional_write store passes conditional_write_conformance (older and duplicate versions never
    apply, tombstones are versioned and never resurrected, tenants isolated); the in-memory driver passes, a last-write-wins
    store fails.
  sources:
  - docs/adr/0010-public-api-1.0.md#6. Guarantees as a lattice, labels derived from mechanisms (amends ADR-0005)
