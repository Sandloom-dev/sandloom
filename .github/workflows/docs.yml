name: Docs

on:
  workflow_call:

# Documentation builds produce CI artifacts; deployment is a separate operation.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Names Public API 1.0 removed or renamed (spec Appendix C) must not
      # survive in the docs, AGENTS.md files, skills or READMEs (stdlib only).
      - name: Stale-symbol lint
        run: |
          python3 tools/docs/docs_stale_symbols.py --self-test
          python3 tools/docs/docs_stale_symbols.py

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # dev: the reference pages import sandloom.sdk.testing, which needs pytest.
      - name: Install backend + docs dependencies
        working-directory: .
        run: |
          uv sync --locked --all-extras
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build docs (strict)
        run: python3 tools/docs/docs_site.py build

      - name: Check published pages, search and Markdown examples
        run: uv run --locked python -m unittest discover -s tools/docs -p test_docs_site.py

      - name: Upload built documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandloom-docs
          path: build/site
          retention-days: 3
