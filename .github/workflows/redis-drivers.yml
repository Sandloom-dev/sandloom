name: Redis drivers conformance

on:
  pull_request:
    branches: [main, arch/kernel-boundary]
    paths:
      - 'packages/sandloom-redis/**'
      - 'src/sandloom/core/infra/**'
      - 'src/sandloom/core/drivers/**'
      - 'src/sandloom/core/tests/test_atomic_store.py'
      - 'src/sandloom/core/tests/test_lease.py'
      - 'src/sandloom/core/tests/test_broadcast_redis.py'
      - 'src/sandloom/driverkit/**'
      - 'src/sandloom/sdk/**'
      - '.github/workflows/redis-drivers.yml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Redis atomic_store, lease and broadcast conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@127.0.0.1:5433/sandloom_test
      CACHE_URL: redis://127.0.0.1:6380/0
      BROKER_URL: redis://127.0.0.1:6380/14
      JWT_SECRET: ci-redis-drivers-not-a-real-secret
      SANDLOOM_TEST_OWNER: ci-redis-drivers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false
      - name: Install Sandloom and the built driver package
        # The package under test is its wheel, not the editable checkout: the
        # entry points the registry reads are the ones the wheel ships.
        run: |
          uv sync --frozen --group packaging
          uv build packages/sandloom-redis --out-dir "$RUNNER_TEMP/redis-dist"
          uv pip install --reinstall --no-deps "$RUNNER_TEMP"/redis-dist/*.whl
      - name: Check the driver package style
        run: |
          uv run --no-sync ruff check packages/sandloom-redis
          uv run --no-sync ruff format --check packages/sandloom-redis
      - name: Start test services
        # Redis with 256 databases: every xdist worker gets an index of its own.
        run: docker compose -f deploy/compose/test.yml up -d --wait
      - name: Run the driver tests, their conformance kits and the kernel's use of them
        run: >-
          uv run --no-sync pytest -n 2 --dist loadfile
          packages/sandloom-redis/tests
          src/sandloom/core/tests/test_atomic_store.py
          src/sandloom/core/tests/test_lease.py
          src/sandloom/core/tests/test_broadcast_redis.py
