name: Controlled serial-isolation comparison

# Temporary diagnostic branch only: compare two reviewed commits sequentially
# on one standard GitHub VM. No publishing, deployment, secrets or write token.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolation-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sandloom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: false
      - name: Record hardware, prepare both commits and compare serial suites
        env:
          PROFILE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PROFILE_REDIS_CONTAINER: ${{ job.services.redis.id }}
          PYTHONHASHSEED: "1234"
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path.cwd()
          temporary = Path(os.environ['RUNNER_TEMP'])
          output = temporary / 'isolation-control-results'
          output.mkdir()
          baseline = 'e9bb04483e6342c569fd9f1366139ed458a7ecc1'
          candidate = 'd10fc23547dc1ab9b0a6cf4241695baca6bbb993'
          owner = 'sandloom-isolation-control-' + os.environ['GITHUB_RUN_ID']
          common = dict(os.environ)
          for key in ('VIRTUAL_ENV', 'UV_PROJECT_ENVIRONMENT', 'UV_PROJECT',
                      'PYTEST_ADDOPTS', 'SANDLOOM_TEST_CACHE_URL',
                      'SANDLOOM_TEST_BROKER_URL', 'PYTHONPATH'):
              common.pop(key, None)
          common.update({
              'CACHE_URL': 'redis://127.0.0.1:6380/0',
              'BROKER_URL': 'redis://127.0.0.1:6380/14',
              'JWT_SECRET': 'ci-isolation-suite-not-a-real-secret',
              'GOOGLE_CLIENT_ID': 'ci-dummy-google-client-id',
              'GOOGLE_CLIENT_SECRET': 'ci-dummy-google-client-secret',
              'SANDLOOM_TEST_OWNER': owner,
              'SANDLOOM_E2E_REQUIRED': '1',
          })

          def run(args, *, cwd=root, env=common, capture=False):
              print('$ ' + ' '.join(map(str, args)), flush=True)
              return subprocess.run(list(map(str, args)), cwd=cwd, env=env,
                                    check=True, text=True, capture_output=capture)

          def database(name):
              assert name.isidentifier() and name.startswith('isolation_control_')
              sql = f'DROP DATABASE IF EXISTS "{name}" WITH (FORCE);'
              run(['docker', 'exec', os.environ['PROFILE_POSTGRES_CONTAINER'],
                   'psql', '-U', 'test_user', '-d', 'postgres', '-v',
                   'ON_ERROR_STOP=1', '-c', sql])
              run(['docker', 'exec', os.environ['PROFILE_POSTGRES_CONTAINER'],
                   'psql', '-U', 'test_user', '-d', 'postgres', '-v',
                   'ON_ERROR_STOP=1', '-c', f'CREATE DATABASE "{name}";'])

          def redis_reset():
              run(['docker', 'exec', os.environ['PROFILE_REDIS_CONTAINER'],
                   'redis-cli', 'FLUSHALL'])

          hardware = {
              'python': sys.version,
              'platform': platform.platform(),
              'cpu_count': os.cpu_count(),
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'lscpu': run(['lscpu'], capture=True).stdout,
              'meminfo': Path('/proc/meminfo').read_text(),
              'uv': run(['uv', '--version'], capture=True).stdout.strip(),
              'baseline': baseline,
              'candidate': candidate,
              'shuffle_seed': 1234,
              'hypothesis_seed': 1234,
              'pythonhashseed': 1234,
          }
          (output / 'hardware.json').write_text(json.dumps(hardware, indent=2))
          print(json.dumps({k: v for k, v in hardware.items()
                            if k not in ('lscpu', 'meminfo')}, indent=2))

          # Collection warms each checkout's bytecode/import paths and records
          # both the complete case set and the actual serial selection. It does
          # not reuse any application process or test fixture across runs.
          collector = temporary / 'collect_isolation_control.py'
          collector.write_text('''import json, sys\nfrom pathlib import Path\nimport pytest\nclass Proof:\n    @pytest.hookimpl(wrapper=True, tryfirst=True)\n    def pytest_collection_modifyitems(self, items):\n        complete = list(items)\n        result = yield\n        self.complete = {i.nodeid: bool(i.get_closest_marker("subprocess_probe")) for i in complete}\n        self.selected = [i.nodeid for i in items]\n        return result\n    def pytest_sessionfinish(self, session, exitstatus):\n        Path(sys.argv[1]).write_text(json.dumps({"exit": exitstatus, "all": self.complete, "selected": self.selected}, indent=2))\nraise SystemExit(pytest.main(sys.argv[2:], plugins=[Proof()]))\n''')
          selection = ['-q', '-p', 'no:xdist', '-p', 'no:cacheprovider',
                       '--sandloom-shuffle=1234', '--hypothesis-seed=1234',
                       '-m', 'not subprocess_probe']
          prepared = []
          for label, revision in [('baseline', baseline), ('candidate', candidate)]:
              checkout = temporary / ('isolation-control-' + label)
              run(['git', 'worktree', 'add', '--detach', checkout, revision])
              actual = run(['git', 'rev-parse', 'HEAD'], cwd=checkout,
                           capture=True).stdout.strip()
              assert actual == revision
              db = 'isolation_control_' + label + '_test'
              database(db)
              redis_reset()
              env = dict(common)
              url = 'postgresql+asyncpg://test_user:test_password@127.0.0.1:5433/' + db
              env.update(DATABASE_URL=url, SANDLOOM_TEST_DATABASE_URL=url,
                         HYPOTHESIS_STORAGE_DIRECTORY=str(temporary / ('hypothesis-' + label)))
              run(['uv', 'sync', '--frozen'], cwd=checkout, env=env)
              python = checkout / '.venv' / 'bin' / 'python'
              run([python, '--version'], cwd=checkout, env=env)
              freeze = run(['uv', 'pip', 'freeze', '--python', python],
                           cwd=checkout, env=env, capture=True).stdout
              (output / (label + '-dependencies.txt')).write_text(freeze)
              collection = output / (label + '-collection.json')
              with (output / (label + '-collection.log')).open('w') as log:
                  argv = [str(python), str(collector), str(collection),
                          '--collect-only', *selection]
                  collected = subprocess.run(argv, cwd=checkout, env=env,
                                             stdout=log, stderr=subprocess.STDOUT,
                                             text=True, timeout=300)
              assert collected.returncode == 0, label + ' collection failed'
              prepared.append((label, revision, checkout, python, db, env))

          locks = [hashlib.sha256((row[2] / 'uv.lock').read_bytes()).hexdigest()
                   for row in prepared]
          assert locks[0] == locks[1], 'dependency locks differ'
          hardware['uv_lock_sha256'] = locks[0]
          (output / 'hardware.json').write_text(json.dumps(hardware, indent=2))
          before = json.loads((output / 'baseline-collection.json').read_text())
          after = json.loads((output / 'candidate-collection.json').read_text())
          assert set(before['all']) <= set(after['all']), 'candidate removed full-suite cases'
          removed = sorted(set(before['selected']) - set(after['selected']))
          assert all(after['all'].get(node) is True for node in removed), (
              'a retained test was removed for something other than subprocess_probe')
          proof = {
              'baseline_all': len(before['all']),
              'candidate_all': len(after['all']),
              'baseline_serial': len(before['selected']),
              'candidate_serial': len(after['selected']),
              'new_child_only_exclusions': removed,
              'new_retained_cases': sorted(set(after['selected']) - set(before['selected'])),
          }
          (output / 'selection-proof.json').write_text(json.dumps(proof, indent=2))
          print('Serial selection proof:', json.dumps(proof), flush=True)

          results = []
          try:
              for label, revision, checkout, python, db, env in prepared:
                  # Reset only this job's services before each timed trial.
                  database(db)
                  redis_reset()
                  report = output / (label + '.xml')
                  argv = ['/usr/bin/time', '-v', str(python), '-m', 'pytest',
                          *selection, '--durations=25', '--junitxml=' + str(report)]
                  print('TIMED START', label, revision, ' '.join(argv), flush=True)
                  start = time.monotonic()
                  with (output / (label + '.log')).open('w') as log:
                      trial = subprocess.run(argv, cwd=checkout, env=env,
                                             stdout=log, stderr=subprocess.STDOUT,
                                             text=True, timeout=1200)
                  seconds = time.monotonic() - start
                  suites = list(ET.parse(report).getroot().iter('testsuite'))
                  counts = {key: sum(int(s.attrib.get(key, 0)) for s in suites)
                            for key in ('tests', 'failures', 'errors', 'skipped')}
                  counts['passed'] = counts['tests'] - counts['failures'] - counts['errors'] - counts['skipped']
                  result = {'label': label, 'revision': revision,
                            'seconds': seconds, 'exit': trial.returncode, **counts,
                            'command': argv}
                  results.append(result)
                  (output / 'summary.json').write_text(json.dumps(results, indent=2))
                  print('TIMED RESULT', json.dumps(result), flush=True)
                  print((output / (label + '.log')).read_text()[-14000:], flush=True)
          finally:
              if len(results) == 2 and all(r['exit'] == 0 for r in results):
                  ratio = results[1]['seconds'] / results[0]['seconds']
                  delta = results[0]['seconds'] - results[1]['seconds']
                  print(f'PAIR RESULT: candidate/baseline={ratio:.4f}; saved={delta:.2f}s; improvement={(1-ratio)*100:.2f}%')
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('# Controlled serial-isolation comparison\n\n')
                      summary.write('| Commit | Seconds | Passed | Skipped/xfail |\n|---|---:|---:|---:|\n')
                      for row in results:
                          summary.write(f"| {row['label']} `{row['revision'][:12]}` | {row['seconds']:.2f} | {row['passed']} | {row['skipped']} |\n")
                      summary.write(f'\nCandidate improvement: {(1-ratio)*100:.2f}% ({delta:.2f}s). One sequential pair on one VM; not a statistical guarantee.\n')
          if len(results) != 2 or any(r['exit'] != 0 for r in results):
              raise SystemExit('A controlled trial did not pass; inspect uploaded logs')
          PY
      - name: Retain controlled comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolation-control-${{ github.run_id }}
          path: ${{ runner.temp }}/isolation-control-results/
          if-no-files-found: error
          retention-days: 7
