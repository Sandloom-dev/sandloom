name: Website (GitHub Pages)

# A build never publishes by itself. The owner explicitly requests a deployment
# from main after configuring the custom domain and reviewing the site.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the reviewed site to sandloom.dev (main only)"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false
      - name: Install locked site dependencies
        run: uv sync --locked --all-extras
      - name: Build the unified public site
        run: uv run --locked python tools/docs/docs_site.py build --site-url https://sandloom.dev
      - name: Check pages, search, metadata and examples
        env:
          SANDLOOM_DOCS_SITE_PUBLIC: "1"
        run: uv run --locked python -m unittest discover -s tools/docs -p test_docs_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          retention-days: 3

  deploy:
    if: ${{ inputs.deploy && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
        with:
          enablement: false
      - name: Require the configured production domain
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$PAGES_HOST" != "sandloom.dev" ] || [ -n "$PAGES_BASE_PATH" ]; then
            echo "Configure the repository's Pages custom domain as sandloom.dev first."
            exit 1
          fi
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
