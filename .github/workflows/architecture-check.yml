name: Architecture Check

on:
  workflow_call:

concurrency:
  group: architecture-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # These checks are purely static (AST / import-boundary analysis) and open no
    # connections, but collecting the tests imports the app settings, which
    # validate these required fields at import time. The runner has no `.env`
    # (it is gitignored), so provide dummy values to satisfy validation.
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
      CACHE_URL: redis://127.0.0.1:6379/0
      BROKER_URL: redis://127.0.0.1:6379/1
      JWT_SECRET: ci-architecture-check-not-a-real-secret
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Install dependencies
        # Locked: the default `dev` group pins the exact tool versions.
        run: uv sync --frozen

      - name: Run architecture checker
        run: uv run python tools/checks/check_architecture.py

      - name: Run public API surface gate
        run: uv run python tools/packaging/check_public_api.py

      - name: Run architecture test
        run: uv run pytest src/sandloom/core/tests/test_architecture.py -q
