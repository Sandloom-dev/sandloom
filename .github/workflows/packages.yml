name: Packages (ADR-0001)

# Builds every Sandloom distribution (sandloom, sandloom-identity,
# sandloom-tenancy, sandloom-billing) from the monorepo tree and proves each
# works as installed: sdist round trip and license metadata, import layering
# across distributions (no module imports a distribution its own does not
# depend on, lazy imports included), `pip install sandloom` alone runs every
# CLI subcommand, `sandloom docs` and `sandloom new`, and `sandloom[standard]`
# composes the module packages by entry point. One script, the same one
# contributors run locally: tools/packaging/check_package_distributions.py.

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Retain the exact fully validated distributions for a release"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build, layer-check and install every distribution
        env:
          DIST_ARTIFACT: ${{ inputs.artifact_name }}
          DIST_DIR: ${{ runner.temp }}/validated-distributions
        run: |
          args=()
          if [ -n "$DIST_ARTIFACT" ]; then args=(--dist-dir "$DIST_DIR"); fi
          uv run --locked python tools/packaging/check_package_distributions.py "${args[@]}"
      - name: Validate PyPI descriptions
        if: ${{ inputs.artifact_name != '' }}
        env:
          DIST_DIR: ${{ runner.temp }}/validated-distributions
        run: >-
          uvx --from twine==7.0.0 --with 'certifi>=2026.10.19'
          twine check --strict "$DIST_DIR"/*.whl "$DIST_DIR"/*.tar.gz
      - name: Retain reviewed release files
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/validated-distributions/
          if-no-files-found: error
          retention-days: 7
