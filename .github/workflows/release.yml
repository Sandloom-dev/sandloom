name: Release (PyPI)

# Publication is independent of PR/main pushes. The pypi environment requires
# Maryarty's approval; only the publish job can obtain an OIDC token.
on:
  push:
    tags:
      - "sandloom-v*"
      - "sandloom-identity-v*"
      - "sandloom-tenancy-v*"
      - "sandloom-billing-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Distribution to release (all for a coordinated alpha)"
        required: true
        default: all
        type: choice
        options: [all, sandloom, sandloom-identity, sandloom-tenancy, sandloom-billing]
      dry_run:
        description: "Validate and retain artifacts without uploading to PyPI"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

# Never interrupt an upload or run two releases against the same projects.
concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify source and package selection
        id: plan
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run || github.event_name == 'push' }}
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            export RELEASE_ON_MAIN=true
          else
            export RELEASE_ON_MAIN=false
          fi
          python3 tools/packaging/pypi_release.py plan

  validate:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      full_validation: true

  distributions:
    needs: plan
    uses: ./.github/workflows/packages.yml
    with:
      artifact_name: pypi-validated-${{ github.run_id }}

  prepare:
    needs: [plan, distributions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-validated-${{ github.run_id }}
          path: validated
      - name: Select exact validated archives
        env:
          RELEASE_PLAN: ${{ needs.plan.outputs.manifest }}
        run: python3 tools/packaging/pypi_release.py select --artifacts validated --out reviewed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-release-${{ github.run_id }}
          path: reviewed/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, validate, distributions, prepare]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sandloom/
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, build or dependency installation in the privileged job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-release-${{ github.run_id }}
          path: reviewed
      - name: Check immutable PyPI files and prepare missing uploads
        id: preflight
        run: >-
          python3 reviewed/pypi_release.py preflight
          --manifest reviewed/release-manifest.json --dist reviewed/dist
          --upload reviewed/upload
      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ steps.preflight.outputs.has_uploads == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: reviewed/upload/
          attestations: true
          skip-existing: false
      - name: Verify published artifacts
        run: python3 reviewed/pypi_release.py verify --manifest reviewed/release-manifest.json

  github-release:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Owner approval and successful PyPI verification precede this job.
      # Use the exact reviewed archives, notes and source SHA; never rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-release-${{ github.run_id }}
          path: reviewed
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 reviewed/pypi_release.py github-release
          --manifest reviewed/release-manifest.json --dist reviewed/dist
