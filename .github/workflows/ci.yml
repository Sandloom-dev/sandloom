name: Monorepo CI

on:
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: false
      reused_jobs:
        # JSON list of REUSABLE_JOBS (tools/ci/required_ci.py) whose green PR
        # result on this exact tree the caller verified (release.yml's plan,
        # tools/ci/pr_evidence.py): a full validation skips them.
        type: string
        default: "[]"
  pull_request:
    branches: ["main", "arch/kernel-boundary"]
    # A close event cancels the older PR run without starting its test jobs.
    types: [opened, synchronize, reopened, ready_for_review, closed]

# dorny/paths-filter calls the PR "list files" API on pull_request events; the
# default GITHUB_TOKEN is read-restricted here, so grant the reads it needs.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-policy:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false
      - name: Install locked test tools
        run: uv sync --frozen
      - name: Workflow selection and local-runner regression tests
        run: >-
          uv run pytest --noconftest -p no:cacheprovider -c /dev/null -o addopts=''
          tests/architecture/test_ci_local_runner.py
          tests/architecture/test_ci_workflow_policy.py
          tests/architecture/test_required_ci.py
          tests/architecture/test_pypi_release.py
          tests/architecture/test_pr_evidence.py
          tests/architecture/test_release_sync.py -q
      - name: Reviewed source and credential patterns
        run: |
          python3 tools/packaging/sync_release.py
          python3 tools/packaging/export_repository.py --check
          python3 tools/checks/check_secrets.py

  changes:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # The migration branch always checks boundary, packaging and example gates,
    # even when a PR only changes docs or policy; main keeps its path selection.
    outputs:
      backend: ${{ (inputs.full_validation || github.base_ref == 'arch/kernel-boundary') && 'true' || steps.filter.outputs.backend }}
      admin: ${{ inputs.full_validation && 'true' || steps.filter.outputs.admin }}
      examples: ${{ (inputs.full_validation || github.base_ref == 'arch/kernel-boundary') && 'true' || steps.filter.outputs.examples }}
      deploy: ${{ inputs.full_validation && 'true' || steps.filter.outputs.deploy }}
      benchmarks: ${{ inputs.full_validation && 'true' || steps.filter.outputs.benchmarks }}
      docs: ${{ inputs.full_validation && 'true' || steps.filter.outputs.docs }}
      packages: ${{ (inputs.full_validation || github.base_ref == 'arch/kernel-boundary') && 'true' || steps.filter.outputs.packages }}
      architecture: ${{ (inputs.full_validation || github.base_ref == 'arch/kernel-boundary') && 'true' || steps.filter.outputs.architecture }}
      dependency_review: ${{ inputs.full_validation && 'true' || steps.filter.outputs.dependency_review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.full_validation }}
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'tools/ci/**'
              - 'tools/smoke/**'
              - 'migrations/**'
              - 'packages/**'
              - 'tools/checks/**'
              - 'tools/packaging/*.py'
              - 'tools/packaging/**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'conftest.py'
              - 'architecture_rules.yml'
              - 'guarantees.yml'
              - '.env.test'
              - '.github/workflows/ci.yml'
            admin:
              - 'tools/inspection/**'
              - 'admin/**'
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tools/smoke/admin_live_acceptance.py'
              - '.github/workflows/admin.yml'
              - '.github/workflows/ci.yml'
            examples:
              - 'examples/**'
              - 'docs/getting-started/tutorial.md'
              - 'tools/smoke/tutorial_check.py'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            benchmarks:
              - 'benchmarks/**'
              - 'tools/checks/check_benchmark_dependencies.py'
              - '.github/workflows/ci.yml'

            docs:
              - 'docs/**'
              - 'examples/**'
              - 'website/**'
              - 'LICENSE'
              - 'NOTICE'
              - 'tools/docs/**'
              - 'zensical.toml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/**'
              - '.github/workflows/docs.yml'
              - '.github/workflows/pages.yml'
              - '.github/workflows/ci.yml'
              - '**/AGENTS.md'
              - '**/CLAUDE.md'
              - '**/README.md'
              - '.claude/**'
              - 'deploy/**'
              - 'benchmarks/dx/**'
            packages:
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'packages/**'
              - 'migrations/core/**'
              - 'LICENSE'
              - 'NOTICE'
              - 'tools/packaging/*.py'
              - 'tools/packaging/**/*.py'
              - '.github/workflows/packages.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
            architecture:
              - 'src/**'
              - 'tests/**'
              - 'packages/**'
              - 'tools/checks/**'
              - 'tools/packaging/*.py'
              - 'tools/packaging/**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'docs/adr/**'
              - 'docs/reference/guarantees.md'
              - '.github/workflows/architecture-check.yml'
              - '.github/workflows/ci.yml'
            dependency_review:
              - 'uv.lock'
              - 'pyproject.toml'
              - 'packages/**/pyproject.toml'
              - 'benchmarks/pyproject.toml'
              - 'benchmarks/uv.lock'
              - 'benchmarks/ladder/cg/requirements.txt'
              - 'admin/package-lock.json'
              - 'admin/package.json'
              - 'examples/**'
              - '.github/workflows/dependency-review.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'

  backend-static:
    # Lint / format / types / architecture: no services, runs in parallel with
    # the test matrix (it used to be serialized in front of the suite).
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' && !contains(fromJSON(inputs.reused_jobs || '[]'), 'backend-static') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    env:
      # Importing the package instantiates Settings at module load, so the
      # architecture-test collection needs a valid (dummy) settings env.
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5433/ci
      CACHE_URL: redis://127.0.0.1:6380/0
      BROKER_URL: redis://127.0.0.1:6380/1
      JWT_SECRET: ci-architecture-tests-not-a-real-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Install dependencies
        # Locked sync: the default `dev` dependency group carries the EXACT
        # ruff/mypy/pytest pins from uv.lock, so CI lints and type-checks with
        # the same tool versions as every developer machine and pre-commit
        # (--frozen fails instead of silently re-resolving).
        run: uv sync --frozen

      - name: Restore mypy cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - name: Linting
        run: uv run ruff check --no-fix src/

      - name: Credential patterns
        working-directory: .
        run: python3 tools/checks/check_secrets.py

      - name: Formatting
        run: uv run ruff format --check src/

      - name: Type checking
        run: uv run mypy src/

      - name: Architecture tests
        run: uv run pytest tests/architecture/ -q --no-cov -p no:cacheprovider

      - name: Import-boundary manifest
        run: uv run python tools/checks/check_architecture.py

      - name: Public API surface gate
        run: uv run python tools/packaging/check_public_api.py

      - name: Generated files are current
        env:
          SANDLOOM_COMPOSITION_ROOT: sandloom_standard.main
        run: uv run sandloom generate --check

      - name: Installed-wheel RPC transport smoke
        # Builds the sandloom wheel, installs it ALONE into a clean venv
        # and runs tools/packaging/wheel_rpc_smoke.py there (isolated mode, outside the
        # source tree): aiohttp is packaged, its probe passes, a live RPC call
        # works, and a simulated aiohttp internal-API mismatch falls back to
        # httpx — from the distribution, not the monorepo source.
        run: uv run python tools/packaging/check_wheel_rpc_transport.py

      - name: Dependency vulnerability audit
        run: uv run --with pip-audit pip-audit

  supply-chain:
    # SBOM (CycloneDX from uv.lock). SAST is ruff rule family S in
    # backend-static. One script, the same locally: tools/checks/supply_chain.sh
    # (tool versions pinned there).
    # docs/contributing/supply-chain.md; PR dependency review is its own
    # workflow (dependency-review.yml).
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' && !contains(fromJSON(inputs.reused_jobs || '[]'), 'supply-chain') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: SBOM
        run: tools/checks/supply_chain.sh all

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        # Informational only: an artifact-storage outage must not fail the job.
        continue-on-error: true
        with:
          name: backend-sbom
          path: sbom-out/sandloom-backend.cdx.json
          retention-days: 7

  backend-tests:
    # PRs use Python 3.12 without slow multi-process suites or coverage, in
    # two parts of one seed (the run id): each part takes half the files
    # (`--sandloom-shard`), together the whole fast suite, as xdist workers
    # already split it. Full validation retains all four versions, coverage
    # and the slow suites, each Python one job with a fresh seed.
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(inputs.full_validation && '{"include":[{"python":"3.11","coverage":false,"slow":true,"ledger":"py3.11"},{"python":"3.13","coverage":false,"slow":false,"ledger":"py3.13"},{"python":"3.14","coverage":false,"slow":false,"ledger":"py3.14"},{"python":"3.12","coverage":true,"slow":true,"ledger":"py3.12"}]}' || '{"include":[{"python":"3.12","coverage":false,"slow":false,"part":"1/2","ledger":"part1"},{"python":"3.12","coverage":false,"slow":false,"part":"2/2","ledger":"part2"}]}') }}
    name: backend-tests (py${{ matrix.python }}${{ matrix.coverage && ', coverage' || '' }}${{ !matrix.slow && ', not slow' || '' }}${{ matrix.part && ', part ' || '' }}${{ matrix.part }})
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sandloom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Redis with enough databases for every xdist worker
        # Service containers cannot pass a command, and each worker offsets
        # its Redis DB indexes by 16 * (N + 1) — the default 16 databases are
        # not enough. `--databases 256` covers 15 workers.
        working-directory: .
        run: |
          docker run -d --name redis -p 6380:6379 redis:7 \
            redis-server --databases 256 --save "" --appendonly no
          for _ in $(seq 1 30); do
            docker exec redis redis-cli ping | grep -q PONG && break
            sleep 1
          done

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # One writer per Python key (of the PR's two parts, the first); all
          # other jobs only restore this cache.
          save-cache: ${{ matrix.part != '2/2' }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install the PostgreSQL 16 client (slow lanes)
        # The real pg_dump -> pg_restore round trip of `sandloom backup verify`
        # (test_backup_cli.py::test_real_pg_dump_round_trip, slow) needs a
        # client of the service's major version. The GitHub runner image ships
        # one; the local CI runner's Debian job container gets it from PGDG.
        if: ${{ matrix.slow }}
        run: |
          sudo=$(command -v sudo || true)
          if ! /usr/lib/postgresql/16/bin/pg_dump --version 2>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            $sudo apt-get update -qq
            if ! $sudo apt-get install -y -qq postgresql-client-16; then
              $sudo apt-get install -y -qq postgresql-common
              $sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
              $sudo apt-get install -y -qq postgresql-client-16
            fi
            /usr/lib/postgresql/16/bin/pg_dump --version
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Full test suite (modules + core)
        # --sandloom-shuffle: a fresh seeded order per run (printed in the header
        # and the summary; replay with --sandloom-shuffle=<seed>). The skip
        # ledger (the tests this lane ran and skipped) feeds the skip-ledger job.
        run: >-
          uv run pytest -q -n auto --dist loadfile --durations=25
          -p sandloom.core.testing.skip_ledger --sandloom-skip-ledger-lane=postgresql
          --sandloom-skip-ledger=skip-ledger/postgresql-${{ matrix.ledger }}.json
          --sandloom-shuffle=${{ matrix.part && github.run_id || 'random' }}
          ${{ matrix.part && '--sandloom-shard=' || '' }}${{ matrix.part }}
          ${{ matrix.coverage && '--cov --cov-report=term-missing --cov-report=html' || '' }}
          ${{ !matrix.slow && '-m "not slow"' || '' }}
        env:
          COVERAGE_CORE: ${{ matrix.coverage && 'sysmon' || '' }}
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@127.0.0.1:5433/sandloom_test
          # Keep this on a DIFFERENT redis db than .env.test (db 15): the billing
          # conftest points the idempotency cache at .env.test's CACHE_URL, and
          # the redis driver only takes the shared global client when the
          # instance URL equals settings.cache_url. Matching URLs would route
          # billing through the process-wide default client (mutated by earlier
          # tests) and fail closed with 503 — mirror the local split instead.
          CACHE_URL: redis://127.0.0.1:6380/0
          BROKER_URL: redis://127.0.0.1:6380/14
          JWT_SECRET: ci-full-suite-not-a-real-secret
          # SSO redirect tests need a "configured" Google provider; the values
          # are never sent anywhere (the test only inspects the built auth URL).
          GOOGLE_CLIENT_ID: ci-dummy-google-client-id
          GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
          # The split-deployment e2e (tests/e2e) and the split conformance
          # matrix (tests/split_conformance: every module subset vs the
          # monolith, real uvicorn processes) must RUN in CI: with this set,
          # missing Postgres/Redis fails the job instead of skipping.
          SANDLOOM_E2E_REQUIRED: "1"
          # The pg_dump round trip runs where the client step installed it:
          # `env` resolves pg_dump / pg_restore on the PATH it added.
          SANDLOOM_TEST_PG_CLIENT: ${{ matrix.slow && 'env' || '' }}
          SANDLOOM_TEST_PG_CLIENT_URL: ${{ matrix.slow && 'postgresql://test_user:test_password@127.0.0.1:5433/sandloom_test' || '' }}

      - name: Upload the skip ledger
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: skip-ledger-postgresql-${{ matrix.ledger }}
          path: skip-ledger/
          if-no-files-found: error
          retention-days: 3

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.coverage }}
        # Informational only: an artifact-storage outage must not fail the job.
        continue-on-error: true
        with:
          name: backend-coverage-html
          path: htmlcov
          retention-days: 3

  backend-tests-isolation:
    # Test isolation gate: in-process tests SERIALLY in one process, in a
    # seeded random order (sandloom.core.testing.shuffle: the files, then the tests
    # inside each file). The parallel jobs give each worker a fixed slice of
    # files, which hides a test that passes only because an earlier one left
    # a registry, a binding or a row behind; one process running everything
    # in a fresh order finds it. The seed is printed in the header and the
    # summary: replay with `uv run pytest -p no:xdist --sandloom-shuffle=<seed>
    # --sandloom-shard=<k>/2`. docs/modules/testing.md#test-isolation.
    # Two shards of one seed (the run id): each a serial process over half
    # the files, dealt anew by every seed, together the whole selection.
    # This input is known immediately; no classifier output is consumed.
    # Start the critical serial gate alongside classification, not behind it.
    if: ${{ inputs.full_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: backend-tests-isolation (shard ${{ matrix.shard }}/2)
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sandloom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: In-process suite, serial, shuffled
        # Child-process-only probes cannot leak runtime globals into this
        # process; the unfiltered full matrix above already exercises them.
        run: >-
          uv run pytest -q -p no:xdist -p no:cacheprovider
          --sandloom-shuffle=${{ github.run_id }} --sandloom-shard=${{ matrix.shard }}/2
          -m "not subprocess_probe" --durations=25
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@127.0.0.1:5433/sandloom_test
          CACHE_URL: redis://127.0.0.1:6380/0
          BROKER_URL: redis://127.0.0.1:6380/14
          JWT_SECRET: ci-isolation-suite-not-a-real-secret
          GOOGLE_CLIENT_ID: ci-dummy-google-client-id
          GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
          SANDLOOM_E2E_REQUIRED: "1"

  kernel-without-batteries:
    # ADR-0012 fitness test (KB-05): the kernel's unit, SDK and architecture
    # suites in a venv with the sandloom package alone, and the
    # replaceability fixtures (identity, tenancy and billing replaced by
    # test modules, mono and split). tools/ci/no_batteries.py hides the
    # bundled modules from every import, also from the checkout's src/.
    # Its pending list is empty and only goes down (a ceiling in the tool):
    # a new kernel test that needs a battery fails here; put it in
    # tests/integration/with_batteries or the module's own tests.
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sandloom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@127.0.0.1:5433/sandloom_test
      CACHE_URL: redis://127.0.0.1:6380/0
      BROKER_URL: redis://127.0.0.1:6380/14
      JWT_SECRET: ci-kernel-lane-not-a-real-secret
      SANDLOOM_TEST_OWNER: ci-kernel-without-batteries
      # The replaceability topologies are real uvicorn processes: missing
      # PostgreSQL/Redis fails the job instead of skipping.
      SANDLOOM_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Redis with enough databases for every xdist worker
        working-directory: .
        run: |
          docker run -d --name redis -p 6380:6379 redis:7 \
            redis-server --databases 256 --save "" --appendonly no
          for _ in $(seq 1 30); do
            docker exec redis redis-cli ping | grep -q PONG && break
            sleep 1
          done

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: A venv with the kernel package and no module package
        # The kernel's extras and the pinned dev tools; no sandloom-identity,
        # -tenancy, -billing or -admin. The hook then hides their sources.
        run: |
          uv venv --python 3.12 .venv-kernel
          uv export --frozen --only-group dev --no-hashes --no-emit-project \
            > "$RUNNER_TEMP/dev-requirements.txt"
          uv pip install --python .venv-kernel/bin/python \
            -e "packages/sandloom[redis,celery,check,fast,sqlite,sentry]" \
            -r "$RUNNER_TEMP/dev-requirements.txt"
          .venv-kernel/bin/python tools/ci/no_batteries.py install
          .venv-kernel/bin/python tools/ci/no_batteries.py check

      - name: Kernel suites and the replaceability fixtures
        run: >-
          .venv-kernel/bin/python -m pytest -q -n auto --dist loadfile
          --durations=25 --sandloom-shuffle=random -p tools.ci.no_batteries
          src/sandloom/core/tests tests/sdk tests/architecture
          tests/integration/replaceability

  second-db-test-lane:
    # The second database (spec: design/infra-agnostic/spec.md, section 6).
    # PostgreSQL (backend-tests) is the mandatory lane and runs everything;
    # this lane runs the standard modules' suites, a generated application
    # (sandloom new with the standard modules: served, its own gate) and the
    # examples' module tests on SQLite files. A test that needs a feature
    # SQLite lacks skips (skip_unless_db_feature); the skip-ledger job fails
    # when a test is skipped on every lane. The harness does not emulate
    # PostgreSQL's concurrency here: row-lock races run on PostgreSQL only.
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.examples == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    env:
      CACHE_URL: redis://127.0.0.1:6380/0
      BROKER_URL: redis://127.0.0.1:6380/14
      JWT_SECRET: ci-sqlite-lane-not-a-real-secret
      # The steps run one after another on the job's Redis: one owner, so a
      # later step may reuse the indexes an earlier one marked.
      SANDLOOM_TEST_OWNER: ci-second-db-test-lane
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Redis with enough databases for every xdist worker
        working-directory: .
        run: |
          docker run -d --name redis -p 6380:6379 redis:7 \
            redis-server --databases 256 --save "" --appendonly no
          for _ in $(seq 1 30); do
            docker exec redis redis-cli ping | grep -q PONG && break
            sleep 1
          done

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Standard modules on SQLite
        # One file per xdist worker (<name>_test_gw<N>.db), created by the
        # harness; SANDLOOM_TEST_DATABASE_URL is the only switch. Run when
        # backend-tests runs: its ledger is this one's other lane.
        if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
        run: >-
          uv run pytest -q -n auto --dist loadfile --durations=15
          --sandloom-shuffle=random -m "not slow"
          -p sandloom.core.testing.skip_ledger --sandloom-skip-ledger-lane=sqlite
          --sandloom-skip-ledger=skip-ledger/sqlite-modules.json
          src/sandloom_identity/tests src/sandloom_tenancy/tests
          src/sandloom_billing/tests src/sandloom_admin/tests
        env:
          SANDLOOM_TEST_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/sandloom-sqlite/sandloom_test.db

      - name: Kernel units, sagas and the command log on SQLite
        # The kernel suites whose guarantees are stated for serial writers
        # (G-UOW-09, G-CMD-01, G-SAGA-07): nested units, the saga protocol
        # and its laws, the durable command log. backend-tests runs the same
        # files on PostgreSQL: its ledger is this one's other lane.
        if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
        run: >-
          uv run pytest -q -n auto --dist loadfile --durations=10
          --sandloom-shuffle=random -m "not slow"
          -p sandloom.core.testing.skip_ledger --sandloom-skip-ledger-lane=sqlite
          --sandloom-skip-ledger=skip-ledger/sqlite-kernel.json
          src/sandloom/core/tests/test_sagas_protocol.py
          src/sandloom/core/tests/test_sagas_recovery.py
          tests/laws/test_saga_laws.py
          src/sandloom/core/tests/test_sqlite_nested_units.py
          src/sandloom/core/tests/test_nesting_policy.py
          src/sandloom/core/tests/test_testing_loop_engines.py
          tests/integration/test_durable_command_idempotency.py
        env:
          SANDLOOM_TEST_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/sandloom-sqlite/kernel_test.db

      - name: Examples' module tests on SQLite
        # Each example's own pytest configuration and .env.test, the
        # framework from this commit; keys are prefixed with the example's
        # directory (--sandloom-skip-ledger-base). Run when the examples job
        # runs: its PostgreSQL ledgers are this one's other lane.
        if: ${{ !cancelled() && needs.changes.outputs.examples == 'true' && !contains(fromJSON(inputs.reused_jobs || '[]'), 'examples') }}
        run: |
          for app in linkly helpdesk projecthub academy oidc-identity tutorial; do
            (cd "examples/$app" && \
              SANDLOOM_TEST_DATABASE_URL="sqlite+aiosqlite:///${{ runner.temp }}/sandloom-sqlite/${app}_test.db" \
              "${{ github.workspace }}/.venv/bin/python" -m pytest -q -n 2 -p no:cacheprovider \
                -p sandloom.core.testing.skip_ledger --sandloom-skip-ledger-lane=sqlite \
                --sandloom-skip-ledger="${{ github.workspace }}/skip-ledger/sqlite-example-$app.json" \
                --sandloom-skip-ledger-base="${{ github.workspace }}")
          done

      - name: A generated application on SQLite (sandloom new, serve, its own gate)
        if: ${{ !cancelled() }}
        # The README's SQLite lines in .env, `dev run` without dev services,
        # sign-up to an organization through the standard modules, then the
        # app's `sandloom test` on SQLite (tools/smoke/quickstart_check.py).
        run: >-
          python3 tools/smoke/quickstart_check.py --database sqlite
          --profile standard --redis-url redis://127.0.0.1:6380 --redis-db-base 4

      - name: Upload the skip ledger
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: skip-ledger-sqlite
          path: skip-ledger/
          if-no-files-found: error
          retention-days: 3

  skip-ledger:
    # A test skipped on every lane runs nowhere: merge the lanes' ledgers and
    # fail on any such test that tools/ci/skip_ledger_allowlist.json does not
    # name with a reason (tools/ci/skip_ledger.py).
    # Runs when either lane pair ran (backend-tests + the modules step,
    # examples + the examples step); a skipped job uploads nothing, and each
    # ledger present is judged with the ledgers of its other lane.
    needs: [changes, backend-tests, examples, second-db-test-lane]
    if: ${{ !cancelled() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.examples == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: skip-ledger-*
          path: skip-ledger
          merge-multiple: true
      - name: No test is skipped on every lane
        run: >-
          python3 tools/ci/skip_ledger.py skip-ledger/*.json
          --allowlist tools/ci/skip_ledger_allowlist.json
          --require-lanes postgresql,sqlite
          ${{ inputs.full_validation && '--strict-allowlist' || '' }}

  benchmarks-security:
    # The S5 secure-read security suite (benchmarks/tests): FORCEd RLS
    # isolation under a NON-superuser NOBYPASSRLS role, cross-tenant 404s,
    # fail-closed without a tenant, no GUC leak on a pool of one, 401/402/403
    # with zero DB I/O, read-only write refusal, connection lifecycle and the
    # wire-level round-trip budgets of every variant. It runs on the
    # FRAMEWORK's venv + test harness (benchsuite comes in via PYTHONPATH; the
    # separate benchmarks uv project is only needed for load runs). The
    # service user is a superuser, so the suite's `admin` fixture can (re)build
    # the S5 schema and create the app role itself (benchsuite.setup_db's
    # s5_statements). Variant-matrix skips are explicit (`-rs` lists them).
    # It also runs the ladder load-harness negative controls first, serially
    # (they assert latencies); the S5 suite then runs under xdist like the
    # backend suite: each worker gets its own database, Redis indexes
    # (allocated: this Redis has 16) and app role (<S5_TEST_ROLE>_gw<N>).
    needs: changes
    if: ${{ needs.changes.outputs.benchmarks == 'true' && !contains(fromJSON(inputs.reused_jobs || '[]'), 'benchmarks-security') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sandloom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Benchmark lock and Cachegrind export
        run: uv run --frozen python tools/checks/check_benchmark_dependencies.py

      - name: Load-harness negative controls
        # benchmarks/tests/test_harness_*.py: the ladder load client against a
        # fake server with known rates of wrong statuses / 5xx / timeouts /
        # dropped connections (exact per-class counts, run fails on an
        # unexpected status, sub-ms latency), and the dataset reset (identical
        # row counts at every run start).
        run: >-
          uv run --frozen pytest -c pyproject.toml
          benchmarks/tests/test_harness_loadclient.py
          benchmarks/tests/test_harness_dataset.py
          -q --no-cov -p no:cacheprovider -rs
        env:
          PYTHONPATH: benchmarks:src
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@127.0.0.1:5433/sandloom_test
          CACHE_URL: redis://127.0.0.1:6380/0
          BROKER_URL: redis://127.0.0.1:6380/14
          JWT_SECRET: ci-s5-suite-not-a-real-secret-0123456789
          SANDLOOM_E2E_REQUIRED: "1"

      - name: S5 secure-read security suite
        run: >-
          uv run --frozen pytest -c pyproject.toml benchmarks/tests
          --ignore=benchmarks/tests/test_harness_loadclient.py
          --ignore=benchmarks/tests/test_harness_dataset.py
          -n auto --dist loadfile
          -q --no-cov -p no:cacheprovider -rs
        env:
          PYTHONPATH: benchmarks:src
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@127.0.0.1:5433/sandloom_test
          CACHE_URL: redis://127.0.0.1:6380/0
          BROKER_URL: redis://127.0.0.1:6380/14
          SANDLOOM_TEST_REDIS_DB_STRIDE: auto
          JWT_SECRET: ci-s5-suite-not-a-real-secret-0123456789
          S5_TEST_ROLE: bench_app_ci
          # A missing database fails the job instead of skipping the suite.
          SANDLOOM_E2E_REQUIRED: "1"


  examples:
    # Every example app (examples/*) and the tutorial app pass their OWN gate,
    # the command an app developer runs: `sandloom test --ci --full` (generated
    # files checked, schema & deploy, the full suite, ruff check and format,
    # mypy, `sandloom check`, contract and route snapshots, migration drift), then
    # migrate a fresh database with `sandloom migrate upgrade-all` — against the
    # framework from this commit.
    needs: changes
    if: ${{ needs.changes.outputs.examples == 'true' && !contains(fromJSON(inputs.reused_jobs || '[]'), 'examples') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: linkly
            path: examples/linkly
          - app: helpdesk
            path: examples/helpdesk
          - app: projecthub
            path: examples/projecthub
          - app: academy
            path: examples/academy
          - app: oidc-identity
            path: examples/oidc-identity
          - app: tasklist
            path: examples/tutorial
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sandloom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
    defaults:
      run:
        working-directory: ./${{ matrix.path }}
    env:
      BIN: ${{ github.workspace }}/.venv/bin
      # The checked-in app and tutorial replay run sequentially in one job.
      # Share its owner so the second app can reuse the job's Redis indexes.
      SANDLOOM_TEST_OWNER: ci-example-${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false
      - name: Install the framework (locked, with dev tools)
        working-directory: .
        run: uv sync --frozen
      - name: The app's own gate (sandloom test --ci --full)
        # .env.test points at the services; a fresh seeded test order per run
        # (printed; replay: sandloom test --seed <seed>). --ci writes nothing.
        # The PostgreSQL skip ledger of the app's tests (keys relative to the
        # workspace, as second-db-test-lane's) feeds the skip-ledger job.
        run: $BIN/sandloom test --ci --full
        env:
          PYTEST_ADDOPTS: -p sandloom.core.testing.skip_ledger
          SANDLOOM_SKIP_LEDGER: ${{ github.workspace }}/skip-ledger/postgresql-example-${{ matrix.app }}.json
          SANDLOOM_SKIP_LEDGER_LANE: postgresql
          SANDLOOM_SKIP_LEDGER_BASE: ${{ github.workspace }}
      - name: Upload the skip ledger
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: skip-ledger-postgresql-examples-${{ matrix.app }}
          path: skip-ledger/
          if-no-files-found: error
          retention-days: 3
      - name: Replay the tutorial from an empty application
        if: ${{ matrix.app == 'tasklist' }}
        working-directory: .
        run: >-
          python3 tools/smoke/tutorial_check.py --cli "$BIN/sandloom"
          --postgres-url postgresql://test_user:test_password@127.0.0.1:5433
          --redis-url redis://127.0.0.1:6380 --redis-db-base 4
          --db-prefix sandloom_tutorial_ci_test
      - name: Migrate a fresh database (core chain + module chains)
        env:
          PGPASSWORD: test_password
          ENVIRONMENT: test
          EVENT_BUS_BACKEND: memory
          JWT_SECRET: ci-examples-not-a-real-secret-0123456789
          CACHE_URL: redis://127.0.0.1:6380/0
          BROKER_URL: redis://127.0.0.1:6380/1
          # oidc-identity's issuer module requires its provider settings.
          ACME_IDP_ISSUER: https://idp.example.test
          ACME_IDP_CLIENT_ID: storefront-web
        run: |
          app="${{ matrix.app }}"
          package="${app//-/_}"
          db="mig_$package"
          psql -h localhost -p 5433 -U test_user -d sandloom_test -c "CREATE DATABASE $db"
          psql -h localhost -p 5433 -U test_user -d "$db" -c "CREATE EXTENSION IF NOT EXISTS citext"
          export PYTHONPATH="$PWD" SANDLOOM_COMPOSITION_ROOT="$package.asgi"
          # Unset in .env.example (the tutorial app): every discovered module
          # (sed, not grep: no match is no error under bash -e).
          modules="$(sed -n 's/^SANDLOOM_MODULES=//p' .env.example)"
          if [ -n "$modules" ]; then export SANDLOOM_MODULES="$modules"; fi
          export DATABASE_URL="postgresql+asyncpg://test_user:test_password@127.0.0.1:5433/$db"
          $BIN/sandloom migrate upgrade-all --apply
          $BIN/sandloom migrate upgrade-all --apply   # idempotent second run

  quickstart:
    if: ${{ inputs.full_validation }}
    strategy:
      fail-fast: false
      matrix:
        profile: [bare, identity, tenancy, billing, all]
    name: quickstart (${{ matrix.profile }})
    # The documented quickstart, end to end, in an empty directory, with no
    # manual step: `sandloom new` against the framework from this commit, then the
    # "Next steps" it prints, verbatim (uv sync, sandloom add module, sandloom test with
    # every step PASS, migrations on a fresh database, the app under uvicorn:
    # /health 200 and an authenticated round trip), then `sandloom test --ci`.
    # One script, the same locally (tools/ci/ci_local.sh <ref> --jobs
    # quickstart). Runs in explicit full validation.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sandloom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false
      - name: Install standalone CLI without batteries
        run: |
          uv venv "$RUNNER_TEMP/quickstart-cli"
          uv pip install --python "$RUNNER_TEMP/quickstart-cli/bin/python" ./packages/sandloom
      - name: Quickstart (sandloom new -> next steps -> app round trip -> sandloom test --ci)
        env:
          QUICKSTART_PROFILE: ${{ matrix.profile }}
        run: >-
          python3 tools/smoke/quickstart_check.py
          --cli "$RUNNER_TEMP/quickstart-cli/bin/sandloom"
          --profile "$QUICKSTART_PROFILE"
          --postgres-url postgresql://test_user:test_password@127.0.0.1:5433
          --redis-url redis://127.0.0.1:6380 --redis-db-base 0

  app-split:
    if: ${{ inputs.full_validation }}
    # An `sandloom new` app moves to microservices by configuration only, in an
    # empty directory with no manual step: `sandloom new hub --with
    # identity,tenancy,billing` (the framework from this commit), two modules
    # where one calls the other's contract and consumes its event, the
    # documented `sandloom add deploy` commands (a repeated run changes nothing, no
    # Python file changes), `docker compose config` of the generated profile,
    # the split invariants `sandloom test` checks (SANDLOOM-T014) and every service
    # booted alone with its bindings (`sandloom add deploy --check`). Nothing
    # connects to a database. One script, the same locally
    # (tools/ci/ci_local.sh <ref> --jobs app-split); `--smoke` (run by hand, or
    # SANDLOOM_SPLIT_E2E=1 SANDLOOM_SPLIT_SMOKE=1 tests/e2e/test_app_split.py) also
    # starts the stack and calls through the gateway. Runs in explicit full validation.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false
      - name: Split a fresh app (sandloom new -> sandloom add deploy -> compose config -> checks)
        run: python3 tools/smoke/split_check.py --require-docker

  app-recipes:
    if: ${{ inputs.full_validation }}
    # The `sandloom docs` recipes run as written in a fresh `sandloom new hub --with
    # identity,tenancy,billing` app (the framework from this commit): each
    # recipe's `uv run sandloom add|migrate new` lines and `# file:` blocks, then
    # `sandloom test` on the whole app (every recipe's tests and gates), then
    # `sandloom docs` for contracts, events and recipes from the installed
    # packages. One script, the same locally (tools/ci/ci_local.sh <ref>
    # --jobs app-recipes). Runs in explicit full validation.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sandloom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false
      - name: Recipes (sandloom new -> every recipe -> sandloom test -> sandloom docs)
        run: >-
          python3 tools/smoke/recipes_check.py
          --postgres-url postgresql://test_user:test_password@127.0.0.1:5433
          --redis-url redis://127.0.0.1:6380 --redis-db-base 0

  deploy-profiles:
    # The shipped compose profiles must parse and interpolate with the required
    # variables set (their env is validated against Settings by
    # src/sandloom/core/tests/test_deploy_profiles.py).
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' && !contains(fromJSON(inputs.reused_jobs || '[]'), 'deploy-profiles') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_SECRET: ci-deploy-not-a-real-secret
      JWT_PRIVATE_KEY: ci-deploy-not-a-real-key
      JWT_PUBLIC_KEYS: '{}'
      JWT_KID: ci-deploy
      IDENTITY_RPC_PRIVATE_KEY: ci-deploy-not-a-real-key
      IDENTITY_RPC_KEY_ID: identity-ci
      BILLING_RPC_PRIVATE_KEY: ci-deploy-not-a-real-key
      BILLING_RPC_KEY_ID: billing-ci
      RPC_SERVICE_KEYS: '{}'
      IDENTITY_RPC_DH_PRIVATE_KEY: ci-deploy-not-a-real-key
      IDENTITY_RPC_DH_KEY_ID: identity-dh-ci
      TENANCY_RPC_DH_PRIVATE_KEY: ci-deploy-not-a-real-key
      TENANCY_RPC_DH_KEY_ID: tenancy-dh-ci
      BILLING_RPC_DH_PRIVATE_KEY: ci-deploy-not-a-real-key
      BILLING_RPC_DH_KEY_ID: billing-dh-ci
      RPC_SERVICE_DH_KEYS: '{}'
      INTERNAL_API_TOKEN: ci-deploy-not-a-real-token
      TWOFA_ENCRYPTION_KEY: ci-deploy-not-a-real-key
      BILLING_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker compose config
        run: |
          docker compose -f deploy/compose/monolith.yml config --quiet
          docker compose -f deploy/compose/microservices.yml config --quiet
          METRICS_TOKEN=ci-deploy-not-a-real-token GRAFANA_ADMIN_PASSWORD=ci \
            docker compose -f deploy/compose/monolith.yml \
            -f deploy/docker-compose.observability.yml --profile observability config --quiet
      # Dashboards regenerate identically; promtool checks the scrape config,
      # the alert / SLO rules and runs their unit tests (metric names vs the
      # kernel registry: backend test_observability_bundle.py).
      - name: Observability bundle (promtool)
        run: deploy/observability/check.sh

  microservices-smoke:
    # Bring up the real microservices profile (one container per module behind
    # the nginx gateway) and smoke-test it end to end: gateway /health,
    # register + login through identity, an org on tenancy, a billing
    # endpoint gated on org membership resolved over internal RPC to tenancy,
    # a task executed by the health-checked worker, and a peer outage (billing
    # stopped: the others stay live + ready, the gateway fails fast and then
    # follows the recreated container without a restart).
    needs: changes
    if: ${{ inputs.full_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: deploy/compose/microservices.yml
      BILLING_PROVIDER: fake
      # Smoke stack: no mail server, so the log notifier stands in for the
      # email identity and tenancy require (mail is NOT delivered).
      SANDLOOM_ACCEPTED_RISKS: local_storage_in_prod,billing.fake_psp_in_prod,log_notifier_in_prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dummy secrets (never real; fresh per run)
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_API_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TWOFA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          # Asymmetric access tokens (identity signs, the others verify):
          # a fresh Ed25519 pair, PEMs \n-escaped onto one env line.
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/jwt.pem"
          openssl pkey -in "$RUNNER_TEMP/jwt.pem" -pubout -out "$RUNNER_TEMP/jwt.pub"
          echo "JWT_KID=jwt-ci" >> "$GITHUB_ENV"
          echo "JWT_PRIVATE_KEY=$(awk '{printf "%s\\n", $0}' "$RUNNER_TEMP/jwt.pem")" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEYS=$(python3 -c 'import json,sys; print(json.dumps({"jwt-ci": open(sys.argv[1]).read()}))' "$RUNNER_TEMP/jwt.pub")" >> "$GITHUB_ENV"
          # Service identities for internal RPC: one Ed25519 key per caller.
          for svc in identity billing; do
            openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/$svc-rpc.pem"
            openssl pkey -in "$RUNNER_TEMP/$svc-rpc.pem" -pubout -out "$RUNNER_TEMP/$svc-rpc.pub"
            upper=$(echo "$svc" | tr '[:lower:]' '[:upper:]')
            echo "${upper}_RPC_KEY_ID=$svc-ci" >> "$GITHUB_ENV"
            echo "${upper}_RPC_PRIVATE_KEY=$(awk '{printf "%s\\n", $0}' "$RUNNER_TEMP/$svc-rpc.pem")" >> "$GITHUB_ENV"
          done
          echo "RPC_SERVICE_KEYS=$(python3 -c 'import json,sys; d=sys.argv[1]; print(json.dumps({s: {s + "-ci": open(f"{d}/{s}-rpc.pub").read()} for s in ("identity", "billing")}))' "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          # Response binding: a SEPARATE X25519 key per service (providers too).
          for svc in identity tenancy billing; do
            openssl genpkey -algorithm x25519 -out "$RUNNER_TEMP/$svc-dh.pem"
            openssl pkey -in "$RUNNER_TEMP/$svc-dh.pem" -pubout -out "$RUNNER_TEMP/$svc-dh.pub"
            upper=$(echo "$svc" | tr '[:lower:]' '[:upper:]')
            echo "${upper}_RPC_DH_KEY_ID=$svc-dh-ci" >> "$GITHUB_ENV"
            echo "${upper}_RPC_DH_PRIVATE_KEY=$(awk '{printf "%s\\n", $0}' "$RUNNER_TEMP/$svc-dh.pem")" >> "$GITHUB_ENV"
          done
          echo "RPC_SERVICE_DH_KEYS=$(python3 -c 'import json,sys; d=sys.argv[1]; print(json.dumps({s: {s + "-dh-ci": open(f"{d}/{s}-dh.pub").read()} for s in ("identity", "tenancy", "billing")}))' "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Build and start the microservices profile
        run: docker compose up -d --build
      - name: Smoke test through the gateway
        run: deploy/smoke/microservices-smoke.sh http://localhost:8080
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-build:
    # Build the production image so a broken Dockerfile fails CI, not deploy.
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true' || needs.changes.outputs.deploy == 'true') && !contains(fromJSON(inputs.reused_jobs || '[]'), 'docker-build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          target: production
          push: false
          load: true
          tags: sandloom-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Verify runtime privilege and filesystem boundary
        run: >-
          docker run --rm -i --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
          --tmpfs /app/data:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0700
          --entrypoint python sandloom-backend:ci - --enforce
          < tools/checks/runtime_inventory.py > runtime-inventory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-security-inventory
          path: runtime-inventory.json
          retention-days: 7

  admin-contracts:
    # The admin console's generated contracts are current: contracts/openapi.json
    # is what the backend serves and src/api/generated.ts is what
    # openapi-typescript makes of it (`npm run contracts:check`). admin.yml runs
    # the whole console pipeline; the same Node runner checks the standalone
    # architecture viewer's geometry/report regressions without another CI job.
    # This gate runs with the framework's PR gates
    # (and tools/ci/ci_local.sh), so a backend route change or an openapi.json
    # change without its regenerated generated.ts cannot merge.
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' && !contains(fromJSON(inputs.reused_jobs || '[]'), 'admin-contracts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # The npm download cache admin.yml also uses (keyed on the lock).
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install the backend (export_openapi.py imports the app)
        working-directory: .
        run: uv sync --frozen

      - name: Install the admin's dependencies
        run: npm ci --ignore-scripts

      - name: Architecture viewer geometry and report regressions
        working-directory: .
        run: node --test tools/inspection/test_viewer.mjs

      - name: Generated contracts are current
        run: npm run contracts:check

  docs:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true' }}
    uses: ./.github/workflows/docs.yml

  packages:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.packages == 'true' }}
    uses: ./.github/workflows/packages.yml

  architecture:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.architecture == 'true' }}
    uses: ./.github/workflows/architecture-check.yml

  admin-ui:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.admin == 'true' }}
    uses: ./.github/workflows/admin.yml

  dependency-review:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.dependency_review == 'true' }}
    uses: ./.github/workflows/dependency-review.yml

  ci-required:
    # A close event cancels old runs; its skipped job must not satisfy the
    # required context for an untested commit that is reopened elsewhere.
    name: ${{ github.event.action == 'closed' && 'CI cancellation' || 'CI required' }}
    if: ${{ always() && github.event.action != 'closed' }}
    needs:
      - workflow-policy
      - changes
      - backend-static
      - supply-chain
      - backend-tests
      - backend-tests-isolation
      - kernel-without-batteries
      - second-db-test-lane
      - skip-ledger
      - benchmarks-security
      - examples
      - quickstart
      - app-split
      - app-recipes
      - deploy-profiles
      - microservices-smoke
      - docker-build
      - admin-contracts
      - docs
      - packages
      - architecture
      - admin-ui
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the tested tree for release reuse
        # The release reuses this run's green jobs only for a commit with
        # exactly this tree (tools/ci/pr_evidence.py select); the job results
        # it reads from GitHub, never from this file.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/pr_evidence.py record --out ci-evidence/evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'pull_request' }}
        # Without it a release only runs every job again.
        continue-on-error: true
        with:
          name: ci-evidence
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Validate required job results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_FULL_VALIDATION: ${{ inputs.full_validation || false }}
          CI_REUSED_JOBS: ${{ inputs.reused_jobs || '[]' }}
          CI_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: python3 tools/ci/required_ci.py
